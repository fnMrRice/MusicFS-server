# Include inside the http context. Replace names, certificate paths and CA.
map $http_upgrade $musicfs_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 443 ssl;
    server_name musicfs.example;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    client_max_body_size 16m;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_trusted_certificate /etc/nginx/tls/musicfs-ca.pem;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $musicfs_connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
