    "/source-tracks": {"get": {"operationId": "listSourceTracks", "parameters": [{"name": "providerInstanceId", "in": "query", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}, {"name": "cursor", "in": "query", "schema": {"type": "string"}, "description": "绑定用户、实例过滤、稳定排序及 libraryRevision 的不透明游标；快照失效为 CURSOR_EXPIRED。"}, {"name": "groupBy", "in": "query", "schema": {"enum": ["recording"]}}], "responses": {"200": {"$ref": "#/components/responses/SourceTracks"}, "default": {"$ref": "#/components/responses/Error"}}, "description": "普通音乐范围排除本人已发布ASMR作品或CD抓轨副本的音频，分类及计数只含可见成员。groupBy=recording时先按本人录音关联聚合再分页；含可见音乐versions及matchingRevision，优先可播放版本为代表。provider过滤保留组内所有可见音乐来源。游标绑定本人、provider和分组模式，固定两种修订，10分钟过期。"}},
    "/source-tracks/{id}/details": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getSourceTrackDetails", "description": "读取本人来源版本的插件详情；标题、分组、字段名及值均由对应来源插件生成，客户端仅按顺序展示纯文本。宿主先校验所有者和实例权限，检查当前文件版本；离线、文件变更或不支持时明确失败，不返回列表字段替代插件结果。", "responses": {"200": {"description": "来源插件提供的详细信息；空 sections 表示插件没有附加信息。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceTrackDetails"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
