{
  "openapi": "3.1.0",
  "info": {"title": "MusicFS 最小服务 API", "version": "1.0.0", "description": "本地播放、资产证据、完整摘要、局部指纹、人工关联和歌词/封面补全及显式写回契约。接口是否可用以阶段验收记录为准。JSON 语法是 YAML 1.2 子集；模型单一来源为 http.schema.json。"},
  "servers": [{"url": "/api/v1"}],
  "security": [{"sessionCookie": []}],
  "paths": {
    "/online-instances/{id}/download-qualities": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"getOnlineDownloadQualities","description":"读取本人在线来源支持的单次下载音质及默认档。","responses":{"200":{"description":"来源音质档位","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineDownloadQualities"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/download-jobs": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"createOnlineDownloadJob","description":"按选定音质后台下载一首或多首曲目，重复曲目按首次出现去重。使用已校验的平台账号。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineDownloadRequest"}}}},"responses":{"202":{"description":"已接受的下载任务","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineDownloadJob"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-download-jobs/{id}": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"getOnlineDownloadJob","description":"读取当前用户的下载任务及每首曲目的完成版本或失败原因。轮询时可只读取摘要。","parameters":[{"in":"query","name":"view","schema":{"type":"string","enum":["summary"]}}],"responses":{"200":{"description":"下载任务明细或摘要","content":{"application/json":{"schema":{"oneOf":[{"$ref":"./http.schema.json#/$defs/OnlineDownloadJob"},{"$ref":"./http.schema.json#/$defs/OnlineDownloadSummary"}]}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/library/albums/{id}/merge-tracks": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"mergeMusicAlbumTracks","description":"将本专辑内人工选中的曲目合并到指定的主曲目，校验专辑、曲目和录音关联修订。提供 metadata 时，在同一事务按最终编辑值写入标题、别名、歌手、封面、风格、年份及评分，空数组或空值可清除相应资料。省略 metadata 时自动汇总原资料。支持同时合并有来源和无来源曲目；多来源合成新的录音组时使用响应中的 trackId。若所选歌曲在另一张专辑占用不同曲位，返回 ALBUM_TRACK_SLOT_CONFLICT。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MergeMusicAlbumTracks"}}}},"responses":{"200":{"description":"返回合并后的主曲目。","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MusicTrack"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/scrapers": {"get":{"operationId":"listOnlineScrapers","description":"返回已装配在线刮削插件的类型、支持字段和可用状态。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineScrapers"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/scrapers/{id}/search": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"searchOnlineScraper","description":"按单个声明字段查询来源，返回本人短期候选及选用令牌。专辑详情和曲目表默认可复用缓存，传入 refresh=true 可重新读取平台资料。资料选用通过单独的保存接口完成。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineScraperCandidates"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"}],"x-idempotency":"read-only","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineScraperSearch"}}}}}},
    "/works/{id}/scraped-fields": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"listWorkScrapedFields","description":"读取本人作品逐字段选用的资料及来源。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/WorkScrapedFields"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/library/albums/{id}/metadata-merge": {"parameters":[{"$ref":"#/components/parameters/ID"}],"put":{"operationId":"mergeMusicAlbumMetadata","description":"按人工选择的字段合并同一发行版的完整候选，未选字段、原名和当前页面关联保持；检查专辑修订并原子保存。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MusicAlbumMergeInput"}}}},"responses":{"default":{"$ref":"#/components/responses/Error"},"200":{"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/ScrapedMusicAlbumRevision"}}},"description":"成功"}}}},
    "/library/albums/{id}/scraped-fields": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"listMusicAlbumScrapedFields","description":"读取本人曲目列表专辑逐字段选用的在线资料及来源。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MusicAlbumScrapedFields"}}}},"default":{"$ref":"#/components/responses/Error"}}},"put":{"operationId":"selectMusicAlbumScrapedBundle","description":"原子选用同一发行版的专辑详情和完整曲目表，补齐无音源曲目并保留已有来源与手填资料。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MusicAlbumScrapedBundleInput"}}},"required":true},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/ScrapedMusicAlbumRevision"}}},"description":"成功"},"default":{"$ref":"#/components/responses/Error"}}},"delete":{"operationId":"clearMusicAlbumScrapedFields","description":"按专辑修订清空已保存的平台资料及曲目表，删除仅属于该专辑且无人使用的刮削占位曲目。保留音源、手动资料、已合并到主表的元数据、受引用的曲目、手动合并映射和平台链接。已清空时返回当前修订。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/ClearMusicAlbumScrapedInput"}}}},"responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/ScrapedMusicAlbumRevision"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/library/albums/{id}/scraped-fields/{field}": {"parameters":[{"$ref":"#/components/parameters/ID"},{"in":"path","name":"field","required":true,"schema":{"$ref":"./http.schema.json#/$defs/MusicAlbumScrapedFieldName"}}],"put":{"operationId":"selectMusicAlbumScrapedField","description":"按音乐专辑修订选用专辑详情、曲目表或封面，保存来源资料并递增专辑和曲库修订；保留主资料和曲目关联。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/ScrapedMusicAlbumRevision"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MusicAlbumScrapedFieldInput"}}}}}},
    "/works/{id}/scraped-fields/{field}": {"parameters":[{"$ref":"#/components/parameters/ID"},{"in":"path","name":"field","required":true,"schema":{"$ref":"./http.schema.json#/$defs/OnlineScraperField"}}],"put":{"operationId":"selectWorkScrapedField","description":"按作品修订选用候选并保存该字段的资料、来源和上游编号。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/ScrapedWorkRevision"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/WorkScrapedFieldInput"}}}}}},
    "/source-tracks/{id}/scraped-fields/{field}": {"parameters":[{"$ref":"#/components/parameters/ID"},{"in":"path","name":"field","required":true,"schema":{"enum":["lyrics","artwork"]}}],"put":{"operationId":"selectSourceTrackScrapedField","description":"按资产版本及媒体选择修订选用歌词或封面。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MediaSelection"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/TrackScrapedFieldInput"}}}}}},
    "/library/sources/{id}/track": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMusicTrackForSource", "description": "读取来源当前所属的曲目。", "responses": {"200": {"description": "读取来源当前所属的曲目。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicTrack"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/me/content-history/{type}": {"parameters": [{"name": "type", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-z][a-z0-9_-]{0,63}$"}}], "get": {"operationId": "getContentHistory", "description": "按内容类型读取已登录用户的插件私有播放记录。", "responses": {"200": {"description": "按内容类型读取已登录用户的插件私有播放记录。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ContentHistory"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/library/artists/{id}/names": {"parameters":[{"$ref":"#/components/parameters/ID"}],"put":{"operationId":"updateMusicArtistNames","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/UpdateMusicArtistNames"}}}},"responses":{"200":{"description":"保存歌手的多语言名称。","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/MusicArtist"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/library/artists/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMusicArtist", "description": "按内部编号读取本人曲库中的歌手。", "responses": {"200": {"description": "按内部编号读取本人曲库中的歌手。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicArtist"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/library/genres": {"get": {"operationId": "listMusicGenres", "description": "按账号和普通音乐的展示范围分页。", "responses": {"200": {"description": "按账号和普通音乐的展示范围分页。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicGenrePage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"in": "query", "name": "after", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}, {"in": "query", "name": "q", "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"in": "query", "name": "providerInstanceId", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}]}},

    "/library/tracks": {"get": {"operationId": "listMusicTracks", "description": "可按主曲名或已保存的其他语言名称查询，按主曲名及稳定 ID 分页。sourceOnly=true 在分页前仅保留有普通音乐来源的曲目，离线来源仍保留；省略或 false 可浏览无来源资料。选源与曲目元数据独立；游标绑定账号、筛选条件和修订。", "responses": {"200": {"description": "按账号和普通音乐的展示范围分页。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicTrackPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"in": "query", "name": "after", "schema": {"type": "string", "minLength": 1, "maxLength": 1024}}, {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}, {"in": "query", "name": "q", "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"in": "query", "name": "providerInstanceId", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, {"in": "query", "name": "artistId", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"in": "query", "name": "albumId", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"in": "query", "name": "genre", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"in": "query", "name": "unknown", "schema": {"enum": ["artist", "album", "genre"]}}, {"in": "query", "name": "sourceOnly", "description": "只返回绑定普通音乐来源的曲目；来源离线仍保留。", "schema": {"type": "boolean", "default": false}}]}, "post": {"operationId": "createMusicTrack", "description": "创建本人的资料记录。", "responses": {"default": {"$ref": "#/components/responses/Error"}, "201": {"description": "创建本人的资料记录。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicTrack"}}}}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateMusicTrack"}}}}}},
    "/library/tracks/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMusicTrack", "description": "按内部编号读取本人资料。原单来源曲目已归入另一录音时返回 409 RESOURCE_CHANGED，可按来源查询现有规范曲目。", "responses": {"200": {"description": "按内部编号读取本人资料。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicTrack"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateMusicTrack", "description": "按预期修订保存资料，保留来源和播放偏好。合并前的旧身份返回 409 RESOURCE_CHANGED，需重新选择要编辑的曲目。", "responses": {"200": {"description": "按预期修订保存资料，保留来源和播放偏好。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicTrack"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UpdateMusicTrack"}}}}}},
    "/library/artists": {"get": {"operationId": "listMusicArtists", "description": "按账号和普通音乐的展示范围分页。", "responses": {"200": {"description": "按账号和普通音乐的展示范围分页。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicArtistPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"in": "query", "name": "after", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}, {"in": "query", "name": "q", "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"in": "query", "name": "providerInstanceId", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}]}},
    "/scrapers/album-auto-settings": {"get":{"operationId":"getAlbumAutoSettings","description":"读取当前账号本地专辑的自动刮削来源顺序。","responses":{"200":{"description":"当前修订和来源顺序","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/AlbumAutoSettings"}}}},"default":{"$ref":"#/components/responses/Error"}}},"put":{"operationId":"saveAlbumAutoSettings","description":"保存当前账号查找本地专辑时使用的刮削插件及其优先级。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/AlbumAutoSettingsInput"}}}},"responses":{"200":{"description":"已保存的设置","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/AlbumAutoSettings"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/library/albums/{id}/auto-scrape": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"searchMusicAlbumAutoCandidates","description":"按当前专辑的音源和用户设置搜索，返回最多三个优先同名的候选，供依次选用。传入 providerInstanceId 时按专辑内的指定来源查找。","x-idempotency":"read-only","parameters":[{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/AlbumAutoSearchInput"}}}},"responses":{"200":{"description":"按匹配度排列的候选","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/RankedAlbumCandidates"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/library/albums": {"get": {"operationId": "listMusicAlbums", "description": "按账号和普通音乐的展示范围分页。", "responses": {"200": {"description": "按账号和普通音乐的展示范围分页。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicAlbumPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"in": "query", "name": "unscrapedOnly", "description": "只列出当前账号没有已保存刮削字段的专辑，排除未知专辑分组。", "schema": {"type": "boolean", "default": false}}, {"in": "query", "name": "after", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}, {"in": "query", "name": "q", "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"in": "query", "name": "providerInstanceId", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}]}, "post": {"operationId": "createMusicAlbum", "description": "创建本人的资料记录。", "responses": {"default": {"$ref": "#/components/responses/Error"}, "201": {"description": "创建本人的资料记录。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicAlbum"}}}}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateMusicAlbum"}}}}}},
    "/library/albums/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMusicAlbum", "description": "按内部编号读取本人资料。", "responses": {"200": {"description": "按内部编号读取本人资料。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicAlbum"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateMusicAlbum", "description": "按预期修订保存资料，保留来源和播放偏好。", "responses": {"200": {"description": "按预期修订保存资料，保留来源和播放偏好。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MusicAlbum"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UpdateMusicAlbum"}}}}}},

    "/playlists/{id}/selection": {"post": {"operationId": "appendPlaylistSelection", "description": "同一事务内按expectedRevision校验个人歌单并追加local绑定；保留现有绑定，检查绑定及条目上限。要求幂等键，响应count为本次加入条数。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AppendPlaylistSelectionRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistSelectionResult"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "parameters": [{"$ref": "#/components/parameters/ID"}]},
    "/playlists/selection": {"post": {"operationId": "createPlaylistSelection", "description": "按选择原子新建个人歌单local绑定；只保存每行代表来源，最多10000条，要求幂等键。响应count为本次加入条数，不返回完整绑定。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreatePlaylistSelectionRequest"}}}}, "responses": {"201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistSelectionResult"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/me/favorites/batch": {"post": {"operationId": "setFavoritesSelection", "description": "所选来源按规范曲目去重后原子收藏或取消收藏；一次最多20000行，先校验收藏总限额，失败不写入。保留原收藏时间和指定来源，affected为实际变化的曲目数，sourceTrackIds为全部所选代表来源ID，二者数量可能不同。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FavoritesSelectionRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FavoritesSelectionResult"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural"}},
    "/source-tracks/selection": {"post": {"operationId": "selectSourceTracks", "description": "播放队列按选择读取紧凑引用；只在真正需要播放清单时调用，不用于收藏、歌单或关联。整个选择在同一事务内校验来源、账号和修订。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/TrackSelection"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/TrackSelectionResult"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "read-only"}},
    "/recordings/{id}/cover": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getRecordingCover", "description": "读取本人录音的有效封面及当前成员候选。人工偏好优先，否则按像素面积、短边降序及对象编号升序选取；未知尺寸排末。失效人工偏好保留，展示回退自动结果。", "responses": {"200": {"description": "读取本人录音的有效封面及当前成员候选。人工偏好优先，否则按像素面积、短边降序及对象编号升序选取；未知尺寸排末。失效人工偏好保留，展示回退自动结果。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RecordingCover"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "selectRecordingCover", "description": "按独立封面修订保存人工偏好，objectId必须显式提供，null恢复自动。只能选当前成员有效候选；失效返回RESOURCE_CHANGED，过期修订或幂等键冲突返回CONFLICT。此操作不改来源封面绑定、匹配关系或播放来源。", "responses": {"200": {"description": "按独立封面修订保存人工偏好，objectId必须显式提供，null恢复自动。只能选当前成员有效候选；失效返回RESOURCE_CHANGED，过期修订或幂等键冲突返回CONFLICT。此操作不改来源封面绑定、匹配关系或播放来源。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RecordingCover"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SelectRecordingCover"}}}}}},

