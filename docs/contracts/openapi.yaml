    "/online-instances/{id}/account": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"getPlatformAccount","description":"读取本人的平台账号状态及随机登录代次 revision。网易云会自动校验重启后恢复的凭据，暂时无法校验时可返回 unverified。业务查询要求账号已校验。","responses":{"200":{"description":"账号状态","content":{"application/json":{"schema":{"$ref":"./platform-account.schema.json#/$defs/View"}}}},"default":{"$ref":"#/components/responses/Error"}}},"post":{"operationId":"changePlatformAccount","description":"平台登录、轮询、MusicKit完成、取消、校验及本地解绑；不是MusicFS会话登录。轮询至少间隔3秒，登录挑战3分钟过期；结果不明先GET状态，不自动重复begin。","parameters":[{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./platform-account.schema.json#/$defs/Request"}}}},"responses":{"200":{"description":"账号状态","content":{"application/json":{"schema":{"$ref":"./platform-account.schema.json#/$defs/View"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
