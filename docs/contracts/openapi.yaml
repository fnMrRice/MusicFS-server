{
  "openapi": "3.1.0",
  "info": {"title": "MusicFS 最小服务 API", "version": "1.0.0", "description": "本地播放、资产证据、完整摘要、局部指纹、人工关联和歌词/封面补全及显式写回契约。接口是否可用以阶段验收记录为准。JSON 语法是 YAML 1.2 子集；模型单一来源为 http.schema.json。"},
  "servers": [{"url": "/api/v1"}],
  "security": [{"sessionCookie": []}],
  "paths": {
    "/source-tracks/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getSourceTrack", "description": "按显式来源编号读取本人SourceTrack，供歌单和作品引用解析；包含ASMR及CD抓轨音频。不存在或属于其他用户返回404。不授予播放权限，不公开物理路径。", "responses": {"200": {"description": "本人来源音轨", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceTrack"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/works/{id}/package-sources": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listWorkPackageSources", "description": "本人可用的本地来源与已配置根；不接受查询参数。", "responses": {"200": {"description": "本人可用的本地来源与已配置根；不接受查询参数。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackageSources"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/works/{id}/package-directories": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "browseWorkPackageDirectories", "description": "只浏览本人已授权来源根内相对目录，不返回绝对路径；最多1000个子目录，超限失败。", "responses": {"200": {"description": "只浏览本人已授权来源根内相对目录，不返回绝对路径；最多1000个子目录，超限失败。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackageDirectories"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "providerInstanceId", "in": "query", "required": true, "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, {"name": "rootId", "in": "query", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"name": "path", "in": "query", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 4096}}]}},
    "/works/{id}/package-previews": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "previewWorkPackage", "description": "必须指定副本类型directory或cd_dump；完整有界枚举目录并保留15分钟的本人预览，不发布音轨或作品包。最多5000节点、32层，链接及不完整读取失败。", "responses": {"200": {"description": "必须指定副本类型directory或cd_dump；完整有界枚举目录并保留15分钟的本人预览，不发布音轨或作品包。最多5000节点、32层，链接及不完整读取失败。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackagePreview"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "x-idempotency": "read-only", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackageSelection"}}}}}},
    "/works/{id}/packages": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listWorkPackages", "description": "读取本人作品包及目录树；音轨引用导入版本，附件按节点ID重新授权读取。", "responses": {"200": {"description": "读取本人作品包及目录树；音轨引用导入版本，附件按节点ID重新授权读取。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackages"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "post": {"operationId": "importWorkPackage", "description": "确认预览、重新校验快照并原子保存音轨与树；同位置更新原包，变化返回409。稳定幂等键支持24小时重放，包括Server重启后的成功确认。", "responses": {"200": {"description": "确认预览、重新校验快照并原子保存音轨与树；同位置更新原包，变化返回409。稳定幂等键支持24小时重放，包括Server重启后的成功确认。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackageImport"}}}}}},
    "/works/{id}/packages/{packageId}/attachments/{nodeId}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "packageId", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"name": "nodeId", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "get": {"operationId": "getWorkPackageAttachment", "description": "鉴权并按导入版本稳定读取原附件；默认仅预览1MiB内UTF-8文本或16MiB内栅格图像。download=1以附件下载，禁止任意路径或URL。", "parameters": [{"name": "download", "in": "query", "schema": {"const": "1"}}], "responses": {"200": {"description": "原附件内容", "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}, "text/plain": {"schema": {"type": "string", "format": "binary"}}, "image/png": {"schema": {"type": "string", "format": "binary"}}, "image/jpeg": {"schema": {"type": "string", "format": "binary"}}, "image/gif": {"schema": {"type": "string", "format": "binary"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/content-types": {"get": {"operationId": "listContentTypes", "description": "已注册的内置内容类型；需要登录，不接受查询参数。", "responses": {"200": {"description": "已注册的内置内容类型；需要登录，不接受查询参数。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ContentTypes"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/works": {"get": {"operationId": "listWorks", "description": "本人作品资料，按稳定编号升序分页；查询条件取交集，非固定快照。", "responses": {"200": {"description": "本人作品资料，按稳定编号升序分页；查询条件取交集，非固定快照。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Works"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "contentType", "in": "query", "schema": {"type": "string", "pattern": "^[a-z][a-z0-9_-]{0,63}$"}, "description": "精确内容类型，可查询已停用类型的资料"}, {"name": "packageKind", "in": "query", "schema": {"enum": ["directory", "cd_dump"]}, "description": "至少有一个指定副本类型的作品，与其他条件取交集；多个包不重复作品"}, {"name": "q", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 256}, "description": "标题、简介、外部编号、署名的字面子串；ASCII 大小写不敏感"}, {"name": "tag", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 64}, "description": "精确标签"}, {"name": "credit", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 256}, "description": "精确参与者名称"}, {"name": "after", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 128}, "description": "上一页 nextAfter；改变筛选条件应重新从首屏读取"}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}, "description": "页面大小"}]}, "post": {"operationId": "createWork", "description": "按已注册类型创建本人作品资料；不扫描文件、不按编号自动合并。", "responses": {"201": {"description": "按已注册类型创建本人作品资料；不扫描文件、不按编号自动合并。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Work"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateWork"}}}}}},
    "/works/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getWork", "description": "读取本人作品资料；无需内容插件仍在注册表中。", "responses": {"200": {"description": "读取本人作品资料；无需内容插件仍在注册表中。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Work"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateWork", "description": "按预期修订完整替换资料；类型不可变，旧修订返回409，同键同参数重放。", "responses": {"200": {"description": "按预期修订完整替换资料；类型不可变，旧修订返回409，同键同参数重放。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Work"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UpdateWork"}}}}}},

    "/dsp/settings": {"get": {"operationId": "getDSPSettings", "description": "全局仅管理员可读写。个人未设置或选择继承时使用全局默认，否则个人配置覆盖全局。返回插件声明的输入、输出及参数，不返回可执行路径。", "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateDSPSettings", "description": "校验整条链和修订后保存，仅影响之后创建的播放会话。输出不可继续DSP时禁止后继节点。bufferFrames 为64至16384；外部MFD1 v1仍最多4096。相同幂等键和原修订可重放最后一次相同请求；其他过期修订返回CONFLICT。全局配置只作默认，不与个人链串联。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsRequest"}}}}, "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/dsp/settings/global": {"get": {"operationId": "getGlobalDSPSettings", "description": "全局仅管理员可读写。个人未设置或选择继承时使用全局默认，否则个人配置覆盖全局。返回插件声明的输入、输出及参数，不返回可执行路径。", "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateGlobalDSPSettings", "description": "校验整条链和修订后保存，仅影响之后创建的播放会话。输出不可继续DSP时禁止后继节点。bufferFrames 为64至16384；外部MFD1 v1仍最多4096。相同幂等键和原修订可重放最后一次相同请求；其他过期修订返回CONFLICT。全局配置只作默认，不与个人链串联。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPGlobalSettingsRequest"}}}}, "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/dsp/settings/validate": {"post": {"operationId": "validateDSPSettings", "x-idempotency": "read-only", "description": "只读协商节点输入输出，校验声道、终止标记、缓冲区和已探测编码能力，不启动外部插件、不保存设置。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPValidateRequest"}}}}, "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPPreview"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/matching/bulk-merge": {"post": {"operationId": "bulkMergeMatching", "description": "用户主动执行全库批量关联。score 只处理当前有效且达到 minimumScore 的候选；title_artist 直接按本人全部来源中当前可见且可用曲目的非空标题和完整作者集合匹配，不依赖候选或时长。保留已有录音全部成员，包括暂时不可用成员，忽略明确解除的来源；完整连通组含排除或超过256项时整组跳过。所有成功组在同一事务提交并共用一次人工修订；无匹配不推进修订。同幂等键重放包括统计的原结果。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/BulkMergeRequest"}}}}, "responses": {"200": {"description": "批量关联结果及审计；计数包含扩展后的全部录音成员，跳过组不写入。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/BulkMergeResult"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/plugin-settings/{pluginId}/actions/{actionId}": {"parameters": [{"name": "pluginId", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "actionId", "in": "path", "required": true, "schema": {"type": "string"}}], "post": {"operationId": "executePluginSettingsAction", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": [], "properties": {}}}}}, "description": "调用插件声明的动作。立即识别返回持久任务；同幂等键返回原任务，异键并发返回RATE_LIMITED。", "responses": {"202": {"description": "PluginSettingsJob", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/plugin-settings/{pluginId}": {"parameters": [{"name": "pluginId", "in": "path", "required": true, "schema": {"type": "string"}}], "get": {"operationId": "getPluginSettings", "responses": {"200": {"description": "PluginSettingsPage", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updatePluginSettings", "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsRequest"}}}}, "description": "按schema与设置修订校验后替换当前用户偏好。写入仅在expectedRevision匹配时生效；原修订重试返回CONFLICT而不重复写入，响应不确定时先GET确认。只接受插件声明的字段，不执行脚本、URL或任意宿主命令。FFmpeg 的 decodeOutput 可选择 native、pcm_f32le、pcm_s16le，保存后对新播放会话生效，活动会话与指纹规格保持原有设置。", "responses": {"200": {"description": "PluginSettingsPage", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/matching/candidates": {"get": {"operationId": "listLibraryMatchCandidates", "description": "分页列出本人全曲库当前待确认候选，附当前来源曲目信息；自动识别由插件实现，候选不会自动合并。", "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 256}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 20}}], "responses": {"200": {"description": "MatchCandidates", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MatchCandidates"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/admin/logging": {
      "get": {"operationId": "getLoggingSettings", "description": "仅管理员读取当前全局及插件覆盖等级；不返回日志目录、内容或凭据。", "security": [{"sessionCookie": []}], "responses": {"200": {"description": "当前运行时日志等级", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/LoggingSettings"}}}}, "default": {"$ref": "#/components/responses/Error"}}},
      "put": {"operationId": "setLoggingSettings", "x-idempotency": "natural", "description": "仅管理员原子替换全局等级和全部插件覆盖；需要同源 Origin 与 CSRF。level 和 plugins 均必填，plugins:{} 清除全部覆盖；未知字段、重复键、null、非法等级及插件标识拒绝且保留原配置。不回写 YAML 或数据库，重启恢复启动配置；没有日志文件读取或修改路径能力。", "security": [{"sessionCookie": []}], "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/LoggingSettings"}}}}, "responses": {"200": {"description": "已应用的运行时日志等级", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/LoggingSettings"}}}}, "default": {"$ref": "#/components/responses/Error"}}}
    },
    "/admin/plugin-instances/{id}/directories": {"get": {"operationId": "listManagedPluginDirectories", "description": "仅管理员浏览Local Files部署授权；pending实例也可用。省略path列出允许根，指定path只列该根范围内的直接子目录，不返回文件。此接口允许向管理员返回绝对路径，configuration和普通Provider投影仍脱敏。每页最多检查100个条目，items可能为空而nextCursor非空；只在nextCursor为null时结束。cursor绑定实例、路径、配置修订和目录修改时间；失效返回CURSOR_EXPIRED并重新浏览。", "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "path", "in": "query", "required": false, "schema": {"type": "string", "minLength": 1, "maxLength": 4096}}, {"name": "cursor", "in": "query", "required": false, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}], "responses": {"200": {"description": "部署允许目录或直接子目录；available仅表示当前可读取，不替代保存时的权限和存储隔离校验。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ManagedPluginDirectories"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/events": {"get": {"operationId": "subscribeCapabilityChanges", "security": [{"sessionCookie": []}], "description": "登录后的SSE；首次及重连立即发送capabilities.changed，data为CapabilitiesChangedEvent；通知客户端重新读取授权能力。15秒心跳复核登录，30分钟重连，每会话最多8连接。", "responses": {"200": {"description": "SSE stream", "content": {"text/event-stream": {"schema": {"type": "string"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/admin/plugin-operations/{id}": {"get": {"operationId": "getPluginOperation", "description": "管理员查询操作。停用 succeeded 只表示保存完成，restartRequired 记录该次保存后全局待重启开关的历史标志，不随撤销或重启改写；当前状态以管理快照为准；draining 仅用于配置重建。", "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginOperation"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
