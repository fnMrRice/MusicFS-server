    "/me/recently-played/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "delete": {"operationId": "deleteRecentlyPlayed", "description": "按sourceTrackId删除本人记录；不存在仍204。", "responses": {"204": {"description": "成功"}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}]}},
    "/me/recently-played": {"get": {"operationId": "listRecentlyPlayed", "description": "本人来源曲目按记录时间倒序分页。游标绑定账号、集合、集合和音乐库修订，有效10分钟；变更或过期410，必须刷新，不能拼接不同revision。收藏长期保留最多20000；历史读取/写入时清理，仅保留90天最近1000首。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalCollectionPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}, {"name": "cursor", "in": "query", "schema": {"type": "string", "minLength": 1}}]}, "delete": {"operationId": "clearRecentlyPlayed", "description": "仅清空本人集合；不停止播放或删除音乐。撤销集合游标，最近播放同时清除去重凭据。", "responses": {"204": {"description": "成功"}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}]}, "post": {"operationId": "recordPlaybackStarted", "description": "客户端仅在实际playing后报告。校验当前登录会话、活动播放会话、当前attempt和匹配资源；每session仅记一次，seek/recover不重复计入，新session更新曲目最近时间。删除后新报告可再次记入。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalCollectionEntry"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaybackStartedRequest"}}}}}},
    "/me/favorites/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "delete": {"operationId": "deleteFavorites", "description": "按曲目删除本人的收藏；不存在仍返回 204。", "responses": {"204": {"description": "成功"}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}]}, "put": {"operationId": "putFavorite", "description": "按曲目建档收藏。空请求体保留当前来源；指定 forcedSourceTrackId 固定版本，传 null 恢复曲目默认。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalCollectionEntry"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": false, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SetFavoriteSource"}}}}}},
    "/me/favorites": {"get": {"operationId": "listFavorites", "description": "本人来源曲目按记录时间倒序分页。游标绑定账号、集合、集合和音乐库修订，有效10分钟；变更或过期410，必须刷新，不能拼接不同revision。收藏长期保留最多20000；历史读取/写入时清理，仅保留90天最近1000首。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalCollectionPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}, {"name": "cursor", "in": "query", "schema": {"type": "string", "minLength": 1}}]}, "delete": {"operationId": "clearFavorites", "description": "仅清空本人集合；不停止播放或删除音乐。撤销集合游标，最近播放同时清除去重凭据。", "responses": {"204": {"description": "成功"}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}]}},
    "/me/profile": {"get": {"operationId": "getPersonalProfile", "description": "真实账号资料；未填写昵称为null，头像上传暂不支持。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalProfile"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "putPersonalProfile", "description": "昵称由本人填写；去首尾空白，最多80码点，无控制字符；null或空字符串清空。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalProfile"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PersonalProfileUpdate"}}}}}},
    "/lifecycle": {"get":{"operationId":"getLifecycle","description":"已鉴权的实际loopback连接读取本进程固定启动归属与停机状态，不返回其他会话租约。","responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleStatus"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/lifecycle/leases": {"post":{"operationId":"acquireLifecycleLease","description":"仅client-managed实例接受。绑定本instance/user/auth session；同session+clientId活动租约合并。创建幂等重放不延长expiry。standalone返回415，非loopback连接403，draining503。","parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleAcquireRequest"}}}},"responses":{"201":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleLease"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/lifecycle/leases/{id}/renew": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"renewLifecycleLease","description":"sequence必须为上次成功+1；重复当前序号返回原expiry，跳号/旧序号409，已过期410，draining503。实例不符必须重新发现。","parameters":[{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleRenewRequest"}}}},"responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleLease"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/lifecycle/leases/{id}/release": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"releaseLifecycleLease","description":"自然幂等释放；最后活动租约结束立即进入draining，后续新Client重新发现。draining期间仍接受本人租约释放重放；HTTP监听关闭后不能再查询。","parameters":[{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleReleaseRequest"}}}},"responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/LifecycleLease"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/playback/recovery-profile": {"get":{"operationId":"getRecoveryProfile","parameters":[{"name":"dspExecution","in":"query","schema":{"enum":["server","client"],"default":"server"},"description":"与播放会话一致的音效执行归属；client 返回零服务端增益的无效果身份。"}],"description":"当前可定位处理配置；processingRevision 绑定完整 DSP 链的节点顺序、参数、版本及文件哈希，gainDb=0为默认值。证据必须选择与会话一致的增益；链身份变化后的跨源恢复要求重启。不可用时UNSUPPORTED。","responses":{"200":{"description":"已授权的结果","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/TimelineProfile"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/timeline-evidence": {"post":{"operationId":"createTimelineEvidence","description":"显式人工对齐声明。绑定本人两端当前资产、同Recording、有向覆盖区间、offset和处理配置；不由指纹或相同时长生成。","responses":{"201":{"description":"已授权的结果","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/TimelineEvidence"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/CreateTimelineEvidence"}}}}}},
    "/timeline-evidence/{id}": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"getTimelineEvidence","description":"本人对齐证据及撤销状态；读取历史不承诺当前资产或Recording仍适用。","responses":{"200":{"description":"已授权的结果","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/TimelineEvidence"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/timeline-evidence/{id}/revoke": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"revokeTimelineEvidence","description":"按预期修订撤销；保留历史，幂等重放不复活证据。","responses":{"200":{"description":"已授权的结果","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/TimelineEvidence"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/RevokeTimelineEvidence"}}}}}},
    "/playback/sessions/{id}/recover-source": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"recoverPlaybackSource","description":"显式选择授权候选。有效独立人工证据才continue并撤销旧流，否则promptRestart且不创建新表示。整个会话故障链60秒、同源恢复最多2次、不同目标最多3个且每目标只尝试一次；准备失败亦计入，seek不重置。","responses":{"200":{"description":"已授权的结果","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/RecoveryResult"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/Idempotency"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/RecoverSource"}}}}}},
    "/playlists": {"get": {"operationId": "listPlaylists", "description": "本人个人歌单规则与stale状态；列表不保证跨页固定快照。", "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}, {"name": "q", "in": "query", "schema": {"type": "string", "maxLength": 256}, "description": "Unicode小写后按本人歌单名称包含匹配；after仍为非快照键集分页。"}, {"in": "query", "name": "kind", "schema": {"enum": ["user", "favorites", "recently-played"], "default": "user"}, "description": "按歌单类型读取；收藏和最近播放各有一个账号内固定身份。"}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Playlists"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "post": {"operationId": "createPlaylist", "description": "显式创建有序绑定；新bindingId/entryId省略或空由宿主生成。local表示显式追加引用，可引用本人local或remote source；不写回平台。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreatePlaylistRequest"}}}}, "responses": {"201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Playlist"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/playlists/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getPlaylist", "description": "本人规则、隐藏修订及当前快照修订。", "parameters": [], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Playlist"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "editPlaylist", "description": "整体替换有序绑定与名称，需expectedRevision；已有绑定/出现ID不可换目标。循环、越权与旧修订拒绝。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/EditPlaylistRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Playlist"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/playlists/{id}/rebuild": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "rebuildPlaylist", "description": "按当前匹配/隐藏/子快照事务重建；返回有界收据，条目另按revision分页。原幂等键重放固定原快照。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RebuildPlaylistRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistSnapshotReceipt"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/playlists/{id}/snapshots/{revision}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "revision", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}], "get": {"operationId": "getPlaylistSnapshot", "description": "固定本地revision只分页未全部隐藏的条目，保留每项全部provenance及隐藏标记；每次重新检查来源所有权。", "parameters": [{"name": "offset", "in": "query", "schema": {"type": "integer", "minimum": 0, "maximum": 20000, "default": 0}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistSnapshotPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/playlists/{id}/hidden-rules": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getPlaylistHiddenRules", "description": "独立hideRevision与锚点规则；匹配扩大时needsConfirmation。", "parameters": [], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistHiddenRules"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "post": {"operationId": "hidePlaylistSource", "description": "默认allSources；可限定binding或entry。源锚点与指定出处必须实际存在，新增规则推进hideRevision，不删除来源。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/HidePlaylistRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistHiddenRules"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/playlists/{id}/hidden-rules/{ruleId}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "ruleId", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "put": {"operationId": "changePlaylistHidden", "description": "明确active与confirm；只有active=true,confirm=true才扩大当前匹配成员范围。旧hideRevision返回CONFLICT。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ChangePlaylistHiddenRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistHiddenRules"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/playlists/{id}/changes": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listPlaylistChanges", "description": "本人歌单规则/隐藏变更序号审计，after是上一页返回的十进制序号。", "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "pattern": "^(0|[1-9][0-9]*)$"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PlaylistChanges"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/remote-playlists": {"get": {"operationId": "listRemotePlaylists", "description": "本人显式导入的远程歌单；停用后历史仍可读，列表不是固定跨页快照。", "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylists"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "post": {"operationId": "importRemotePlaylist", "description": "登记导入并返回负责同步的 jobId。任务读取远程曲目元数据，将曲目和来源写入曲库。Bilibili 使用空 accountId 与规范 favorite:<media_id> / audio-menu:<menu_id>，其他平台固定当前已校验账号；不能借匿名来源指定其他账号。相同数字的两类 Bilibili 集合保持独立身份。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ImportRemotePlaylistRequest"}}}}, "responses": {"201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylistImported"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/remote-playlists/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getRemotePlaylist", "description": "读取本人绑定、当前快照修订与失败状态；不含私有配置修订或音频资产。", "parameters": [], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylist"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/remote-playlists/{id}/sync-jobs": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "syncRemotePlaylist", "description": "明确启动同步，绑定预期修订和当前实例配置；同歌单在途任务可合并，实际执行前再次授权。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylistSyncRequest"}}}}, "responses": {"202": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/HashAccepted"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/remote-playlist-sync-jobs/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getRemotePlaylistSync", "description": "只返回本人持久同步任务；error携带本次HTTP请求编号。", "parameters": [], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylistSyncJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/remote-playlist-sync-jobs/{id}/cancel": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "cancelRemotePlaylistSync", "description": "自然幂等取消queued/running任务，终态返回原结果；保留旧快照，无需幂等键。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/HashRequest"}}}}, "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylistSyncJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/remote-playlists/{id}/snapshots/{revision}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "revision", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}], "get": {"operationId": "getRemotePlaylistSnapshot", "description": "分页固定本地revision；保留重复位置与suspectedRemoved。unversioned不代表远端固定版本，remoteSource不含Asset且播放unsupported。", "parameters": [{"name": "offset", "in": "query", "schema": {"type": "integer", "minimum": 0, "maximum": 20000, "default": 0}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RemotePlaylistSnapshotPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/recommendations": {"get": {"operationId": "listRecommendations", "description": "按服务器本地日期，每天首次打开时自动获取当天推荐；后续打开复用已保存的页面。手动刷新遵守来源限流。至少一个来源成功才保存新一轮，全部失败时保留上次推荐及各来源错误。", "parameters": [{"name": "instanceId", "in": "query", "style": "form", "explode": true, "schema": {"type": "array", "maxItems": 8, "uniqueItems": true, "items": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, "description": "按请求顺序选择实例，省略为本人配置顺序；配置多于8实例时必须显式选择。"}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}, {"name": "refresh", "in": "query", "schema": {"type": "boolean", "default": false}, "description": "为 true 时手动刷新当前推荐，不能与大于 0 的 history 同用。"}, {"name": "history", "in": "query", "schema": {"type": "integer", "minimum": 0, "maximum": 5, "default": 0}, "description": "0 为当前推荐，1 为上一轮。读取历史只返回已保存的页面，可回看的最大轮数为响应中的 historyDepth。"}], "responses": {"200": {"description": "各来源的歌单及状态、可回看的历史轮数", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Recommendations"}}}}, "404": {"$ref": "#/components/responses/Error"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances": {"get":{"operationId":"listOnlineInstances","description":"只返回本人在线实例。sourceType=network 由插件握手声明，播放按此选择网络读取。Bilibili 为 anonymous，账号字段为空，不要求平台登录；其他平台沿用已校验账号约束。available 表示实例可用，每项能力以插件声明为准，不代表任意内容可访问。程序路径、配置摘要与账号凭据不公开。","responses":{"200":{"description":"当前用户可见的来源资料","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineInstances"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/playlist-links": {"get":{"operationId":"listPlaylistLinks","description":"读取本人的平台歌单关联、待同步曲目数与最近一次错误码。","responses":{"200":{"description":"本人已关联的歌单","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistLinks"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/playlists/{externalId}/link": {"parameters":[{"$ref":"#/components/parameters/ID"},{"name":"externalId","in":"path","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9:_.-]{0,127}$"}}],"put":{"operationId":"linkOnlinePlaylist","description":"将当前平台账号可写的歌单关联到本人的自建歌单或我的收藏（playlistId 为 favorites）。响应内 jobId 可跟踪远程曲目加入曲库及目标歌单的进度。重复关联相同目标返回已有关系，关联另一目标返回 409。","parameters":[{"$ref":"#/components/parameters/CSRF"}],"x-idempotency":"natural","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistLinkInput"}}}},"responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistLink"}}}},"default":{"$ref":"#/components/responses/Error"}}},"delete":{"operationId":"unlinkOnlinePlaylist","description":"按平台账号和本地歌单解除关联。","parameters":[{"$ref":"#/components/parameters/CSRF"}],"x-idempotency":"natural","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistLinkInput"}}}},"responses":{"204":{"description":"已解除关联"},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/playlist-track-sources": {"parameters":[{"$ref":"#/components/parameters/ID"}],"post":{"operationId":"registerPlaylistTrackSources","description":"按顺序为当前平台账号可见的曲目登记远程来源引用，供个人歌单使用。重复登记返回同一引用。","parameters":[{"$ref":"#/components/parameters/CSRF"}],"x-idempotency":"natural","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistTrackSourcesInput"}}}},"responses":{"200":{"description":"成功","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistTrackSources"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/playlists": {"get":{"operationId":"listOnlinePlaylists","description":"读取当前实例已校验账号的歌单，来源和账号由服务端绑定；支持playlist.list时可用。空列表是真实成功结果，不能以推荐或已导入歌单代替。网易云目录在服务器本地日期首次打开时更新，当日沿用同一目录；刷新成功后旧游标失效。","parameters":[{"name":"refresh","in":"query","description":"仅在首页传 true，立即更新网易云账号歌单目录。","schema":{"type":"boolean","default":false}},{"name":"id","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":50,"default":20}},{"name":"cursor","in":"query","schema":{"type":"string","maxLength":1024}}],"responses":{"200":{"description":"当前账号的来源歌单页","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistsPage"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/search": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"searchOnlineMetadata","description":"按实例查询资料，保留上游顺序与有界分页。Bilibili 仅支持准确公开 BV/AV/au/ml/am 编号及受支持官方链接，支持曲目和收藏夹/音频歌单查询，不提供关键词搜索。结果曲目规范为 video:<BV>:<cid> 或 audio:<sid>；集合规范为 favorite:<media_id> 或 audio-menu:<menu_id>。Bilibili 匿名查询，其他平台要求已校验账号；风控返回 RISK_CONTROL（403），不得变成成功空页。游标绑定实例与查询，过期返回 CURSOR_EXPIRED。","responses":{"200":{"description":"当前用户可见的来源资料","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineSearchPage"}}}},"default":{"$ref":"#/components/responses/Error"}},"parameters":[{"name":"q","in":"query","required":true,"schema":{"type":"string","minLength":1,"maxLength":256}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":50,"default":20}},{"name":"cursor","in":"query","schema":{"type":"string","maxLength":1024}},{"name":"kind","in":"query","schema":{"enum":["tracks","albums","artists","playlists"],"default":"tracks"}}]}},
    "/online-instances/{id}/tracks/{externalId}": {"parameters":[{"$ref":"#/components/parameters/ID"},{"name":"externalId","in":"path","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9:_.-]{0,127}$"}}],"get":{"operationId":"getOnlineTrack","description":"读取曲目元数据；Bilibili 接受规范 video:<BV>:<cid> 或 audio:<sid>，不要求平台账号。metadataDigest 不是音频资产版本，playbackAvailability 固定 unknown，sourceUrl 仅指官方资料页；读取元数据不读取音频正文。上游访问限制按结构化错误返回。","responses":{"200":{"description":"当前用户可见的来源资料","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineTrack"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/playlists/{externalId}": {"parameters":[{"$ref":"#/components/parameters/ID"},{"name":"externalId","in":"path","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9:_.-]{0,127}$"}}],"get":{"operationId":"observeOnlinePlaylist","parameters":[{"name":"refresh","in":"query","description":"立即更新网易云歌单及其曲目顺序。默认同一服务器本地日期复用最近一次成功读取。","schema":{"type":"boolean","default":false}}],"description":"读取一次 unversioned 观察，保留视频分 P、重复位置及 unavailable:<type>:<aid> 失效占位，最多10000项。Bilibili 接受 favorite:<media_id> 或 audio-menu:<menu_id>，不要求平台账号；占位不能作为可播放曲目。complete 不保证远端固定快照，也不自动导入曲库或删除本地条目。","responses":{"200":{"description":"当前用户可见的来源资料","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineObservation"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/daily-songs": {"parameters":[{"$ref":"#/components/parameters/ID"}],"get":{"operationId":"getOnlineDailySongs","description":"按平台顺序读取当前已校验账号的每日推荐歌曲。","parameters":[{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":50,"default":50}}],"responses":{"200":{"description":"当天推荐的曲目及读取时间","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlineDailySongsPage"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
