    "/admin/logging": {
      "get": {"operationId": "getLoggingSettings", "description": "仅管理员读取当前全局及插件覆盖等级；不返回日志目录、内容或凭据。", "security": [{"sessionCookie": []}], "responses": {"200": {"description": "当前运行时日志等级", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/LoggingSettings"}}}}, "default": {"$ref": "#/components/responses/Error"}}},
