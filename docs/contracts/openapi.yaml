    },
    "/playback/sessions/{id}/recover": {
      "parameters": [{"$ref": "#/components/parameters/ID"}],
      "post": {"operationId": "recoverPlayback", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Recover"}}}}, "responses": {"200": {"$ref": "#/components/responses/Playback"}, "default": {"$ref": "#/components/responses/Error"}}}
    },
    "/playback/sessions/{id}/attempts/{attemptId}/stream": {
      "parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "attemptId", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}],
      "get": {"operationId": "getStream", "description": "只能使用服务器返回的 opaque streamUrl。每个请求校验 Cookie、会话归属、尝试状态、期限和固定版本。流开始后错误只能中止，不能追加 JSON。", "parameters": [
        {"name": "Range", "in": "header", "schema": {"type": "string"}},
        {"name": "If-Range", "in": "header", "schema": {"type": "string"}}
      ], "responses": {"200": {"$ref": "#/components/responses/Stream"}, "206": {"$ref": "#/components/responses/PartialStream"}, "416": {"description": "合法但不可满足的范围；Content-Range: bytes */size", "headers": {"Content-Range": {"schema": {"type": "string"}}}}, "default": {"$ref": "#/components/responses/Error"}}},
      "head": {"operationId": "headStream", "description": "使用与 GET 相同的授权与版本校验，只有元信息，没有音频正文。", "responses": {"200": {"description": "表示元信息", "headers": {"Content-Type": {"schema": {"type": "string"}}, "Content-Length": {"schema": {"type": "integer", "minimum": 0}}, "Accept-Ranges": {"schema": {"enum": ["bytes", "none"]}}}}, "default": {"$ref": "#/components/responses/Error"}}}
    }
  },
  "components": {
    "securitySchemes": {"sessionCookie": {"type": "apiKey", "in": "cookie", "name": "musicfs_session"}, "bootstrapBearer": {"type": "http", "scheme": "bearer"}},
    "parameters": {
