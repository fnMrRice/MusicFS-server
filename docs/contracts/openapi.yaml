    "/source-tracks/{id}/fingerprints": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listFingerprints", "description": "列出本人 SourceTrack 当前资产的有效指纹；源离线仍可读取。使用最后一项 ID 的 nextAfter 继续；并发变动时不保证分页快照。", "responses": {"200": {"$ref": "#/components/responses/FingerprintIndexes"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 256}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]}},
    "/fingerprints/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getFingerprintDetail", "description": "显式读取本人指纹媒体明细；保留的历史记录仍可按 ID 审计，索引 current=false。其他所有者与不存在均返回 NOT_FOUND。", "responses": {"200": {"$ref": "#/components/responses/FingerprintDetail"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/matching/revision": {"get": {"operationId": "getMatchingRevision", "description": "返回本人全局人工关联修订；初始为0。bulkMergeAvailable 为 true 时支持全库批量关联，旧服务未返回此字段时客户端隐藏该入口。", "responses": {"200": {"$ref": "#/components/responses/MatchingRevision"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/source-tracks/{id}/match-candidates/refresh": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "refreshMatchCandidates", "description": "自然幂等刷新派生候选；不要求 Idempotency-Key，不推进人工修订。同快照同结果复用 ID 和创建时间；发布前复核修订、资产与证据。省略或空比较池最多选择256条本人来源。", "responses": {"200": {"$ref": "#/components/responses/MatchCandidates"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RefreshMatchCandidates"}}}}}},
    "/source-tracks/{id}/match-candidates": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listMatchCandidates", "description": "仅列本人当前 pending 候选；排除/已关联/陈旧结果不作为当前候选，分数不是概率。", "responses": {"200": {"$ref": "#/components/responses/MatchCandidates"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 256}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 20}}]}},
    "/source-tracks/{id}/recording-link": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getRecordingLink", "description": "未关联与显式人工解除区分 unmatched/unlinked；不改变来源可播放性。", "responses": {"200": {"$ref": "#/components/responses/RecordingSourceLink"}, "default": {"$ref": "#/components/responses/Error"}}}},
