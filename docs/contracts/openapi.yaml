    "/library/categories": {"get": {"operationId": "listLibraryCategories", "description": "普通音乐范围包含已开启曲目展示的CD专辑，排除其余CD专辑、ASMR与电台音频；分类及计数只含可见成员。四类曲目分类固定快照。歌手和专辑按来源及标签分组，流派跨来源折叠大小写；未知元数据具有独立身份。文件夹只返回扫描范围内的安全目录名称和不透明编号；trackCount统计满足筛选的来源曲目，目录计数包含后代。breadcrumbs从根到自身。用categoryId读取单分类，不存在或不属于当前用户/来源返回404。", "parameters": [{"name": "categoryKind", "in": "query", "schema": {"enum": ["artist", "album", "genre", "folder"]}, "description": "分类类型", "required": true}, {"name": "categoryId", "in": "query", "schema": {"type": "string", "maxLength": 128}, "description": "不透明分类编号；集合查询时读取该分类，曲目查询时限定成员"}, {"name": "parentId", "in": "query", "schema": {"type": "string", "maxLength": 128}, "description": "仅文件夹集合可用；省略返回根，设置返回直接子目录，与categoryId互斥"}, {"name": "providerInstanceId", "in": "query", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, {"name": "q", "in": "query", "schema": {"type": "string", "maxLength": 256}}, {"name": "artistId", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "sourceAlbumId", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "rootId", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "directoryId", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "format", "in": "query", "schema": {"type": "string", "maxLength": 64}}, {"name": "genres", "in": "query", "schema": {"type": "array", "items": {"type": "string", "maxLength": 256}, "maxItems": 32}, "style": "form", "explode": true}, {"name": "formats", "in": "query", "schema": {"type": "array", "items": {"type": "string", "maxLength": 256}, "maxItems": 32}, "style": "form", "explode": true}, {"name": "years", "in": "query", "schema": {"type": "array", "items": {"type": "integer", "minimum": 1, "maximum": 1000000}, "maxItems": 128}, "style": "form", "explode": true}, {"name": "sampleRatesHz", "in": "query", "schema": {"type": "array", "items": {"type": "integer", "minimum": 1, "maximum": 1000000}, "maxItems": 128}, "style": "form", "explode": true}, {"name": "availability", "in": "query", "schema": {"type": "array", "items": {"enum": ["available", "missing"]}, "maxItems": 32}, "style": "form", "explode": true}, {"name": "unknownFields", "in": "query", "schema": {"type": "array", "items": {"enum": ["artist", "album", "genre", "year", "sampleRateHz", "sampleratehz", "bitrate", "format"]}, "maxItems": 32}, "style": "form", "explode": true}, {"name": "favoriteOnly", "in": "query", "schema": {"type": "boolean"}}, {"name": "availableOnly", "in": "query", "schema": {"type": "boolean"}}, {"name": "minBitrateBps", "in": "query", "schema": {"anyOf": [{"type": "integer", "minimum": 0}, {"type": "null"}]}}, {"name": "maxBitrateBps", "in": "query", "schema": {"anyOf": [{"type": "integer", "minimum": 0}, {"type": "null"}]}}, {"name": "sort", "in": "query", "schema": {"enum": ["name"]}}, {"name": "order", "in": "query", "schema": {"enum": ["asc", "desc"]}}, {"name": "cursor", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CatalogPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},

    "/works/{id}/package-sources": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listWorkPackageSources", "description": "本人可用的本地来源与已配置根；不接受查询参数。", "responses": {"200": {"description": "本人可用的本地来源与已配置根；不接受查询参数。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WorkPackageSources"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
