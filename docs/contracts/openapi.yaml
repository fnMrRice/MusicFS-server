    "/admin/plugins/{pluginId}/instances": {"get": {"operationId": "listManagedPluginInstances", "description": "管理员读取保存开关和当前运行状态；默认仅列当前用户的账号实例，allUsers=true 时显式列所有用户实例；非账号实例始终可见。停用尚待重启时 reason=RESTART_REQUIRED，effectiveEnabled 仍按当前运行开关计算。", "security": [{"sessionCookie": []}], "parameters": [{"name": "pluginId", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "allUsers", "in": "query", "required": false, "schema": {"type": "boolean", "default": false}, "description": "管理员显式查看所有用户的账号实例。"}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ManagedPluginInstances"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/admin/plugins": {"get": {"operationId": "listManagedPlugins", "description": "管理员读取插件列表，包含普通插件、必需数据库、官方 DSP 增益及音频分析、标签格式、匹配评分、内容转换四类内置算法；execution=builtin 表示在 Server 主进程运行，process 表示显式外部插件。固定内置算法 stateMutable=false 且无普通实例，其 builtin 字段仅描述业务配置与能力，不表示工具就绪或任务正在运行；数据库 required=true 且 stateMutable=false，DSP stateMutable=false，其 dsp 字段仅描述启动配置和原始链位置，不代表正在播放。storage 仅含后端标识、进程模式及宿主内存可用性；不返回路径、摘要、进程参数或数据库选项。外部数据库使用通用身份及已验证发行版本，不假定是 SQLite；默认仅列当前 MusicFS 用户的账号实例，allUsers=true 时列所有用户实例并返回所属用户与已验证账号显示名；非账号实例始终可见。version 为必填有界语义版本；随包声明与 Worker 共用来源，未启动、禁用或待配置时也返回声明版本，成功握手后的有效版本优先；displayCount 的数字、默认单位与译名均来自插件，仅汇总当前可见范围，插件上报 0 时可返回 0；无可见实例、统计缺失或不一致时省略，不显示实例数量；restartRequired 表示有开关待 Server 重启生效或检测到 diskChanged，此时 appliedRevision 不推进至新修订。", "security": [{"sessionCookie": []}], "parameters": [{"name": "allUsers", "in": "query", "required": false, "schema": {"type": "boolean", "default": false}, "description": "管理员显式查看所有用户的账号实例。"}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginManagementSnapshot"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
