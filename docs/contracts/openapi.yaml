    "/media/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMedia", "description": "按所有者和来源授权交付实际验证正文；包括歌词、封面、PNG缩略图和16MiB以内完整刮削JSON文档，后者强制attachment。缺失/损坏返回RESOURCE_CHANGED并标不可用；总交付期限30秒，不承诺Range。", "responses": {"200": {"description": "经过校验的媒体正文", "headers": {"Content-Length": {"schema": {"type": "integer", "minimum": 1, "maximum": 16777216}}, "Content-Disposition": {"schema": {"type": "string"}}, "X-Content-Type-Options": {"schema": {"const": "nosniff"}}}, "content": {"text/plain": {"schema": {"type": "string", "format": "binary"}}, "image/png": {"schema": {"type": "string", "format": "binary"}}, "image/jpeg": {"schema": {"type": "string", "format": "binary"}}, "application/json": {"schema": {"type": "string", "format": "binary"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/media/{id}/info": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMediaInfo", "description": "读取本人内容或派生对象描述；不内嵌正文，不返回文件路径。", "responses": {"200": {"description": "授权媒体对象描述", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MediaObjectInfo"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/source-tracks/{id}/media-selection": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMediaSelection", "description": "当前来源资产、按字段/语言的绑定、人工锁和修订；对象不可用或旧资产绑定不被伪装成已更新内容。", "responses": {"200": {"$ref": "#/components/responses/MediaSelection"}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "selectMedia", "description": "手动选用本人且适用于当前来源资产的对象，并锁定该字段/语言。上传本身不选用；同键重放、旧修订和资产冲突按显式结果返回；不写回音乐文件。", "responses": {"200": {"$ref": "#/components/responses/MediaSelection"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SelectMediaRequest"}}}}}},
    "/source-tracks/{id}/media-selection/unlock": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "unlockMediaSelection", "description": "独立解除字段/语言人工锁；保留现有内容，不自动触发刮削、覆盖或写回。", "responses": {"200": {"$ref": "#/components/responses/MediaSelection"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UnlockMediaRequest"}}}}}},
    "/playback/sessions": {
      "post": {"operationId": "createPlayback", "description": "preferences.dspExecution=client 跳过部署、个人、全局效果、声道扩展及请求 gainDb，忽略旧 outputLayout；保留解密、编解码并优先保留来源声道，必要兼容降混由 FFmpeg 执行。响应 dspExecution 回显会话固定执行归属，seek/recover 沿用；处理缓存隔离无效果快照。省略按 server，但部署 audioDSP.enabled 和 audioChannels.enabled 均默认 false。effectiveProcessing 只返回实际服务端处理。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreatePlayback"}}}}, "responses": {"201": {"$ref": "#/components/responses/Playback"}, "default": {"$ref": "#/components/responses/Error"}}}
    },
    "/playback/sessions/{id}": {
