    "/provider-instances/{id}/root-statistics": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getProviderRootStatistics", "description": "只读当前用户和来源最近完整发布曲库的目录统计，不扫描磁盘。按根编号返回可用来源文件数量和原始文件总字节数，不按录音去重，不含missing文件及歌词封面等附件。配置中的空根返回0，无配置根且无历史时roots为空数组。来源离线仍可查询，未知或他人来源返回NOT_FOUND。", "responses": {"200": {"description": "已发布曲库的目录统计", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RootStatistics"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/provider-instances/{id}/scan-jobs": {
