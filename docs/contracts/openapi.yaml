    "/scraper-instances": {"get": {"operationId": "listScraperInstances", "description": "仅返回当前所有者的安全实例声明；available表示已启用且程序校验通过，不保证每个源都可提取。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ScraperInstances"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/metadata-jobs": {"post": {"operationId": "createMetadataJob", "description": "sourceTrackIds显式来源批量或sourceAlbum编号/预期修订二选一；专辑在入队事务固定成员、当前资产与选择修订，超过64明确拒绝。最多4个实例。查询修正不被本地插件支持，非空修正返回UNSUPPORTED；语言只按声明值过滤，不推断正文。搜索有界预取预览，不改变当前选择。", "responses": {"202": {"$ref": "#/components/responses/HashAccepted"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateMetadataRequest"}}}}}},
    "/metadata-jobs/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMetadataJob", "description": "逐目标状态、问题和安全候选；没有正文、私有路径或资源票据。预览由previewObjectId通过media接口授权读取。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MetadataJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/metadata-jobs/{id}/cancel": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "cancelMetadataJob", "description": "自然幂等取消，不需要幂等键；取消包括已完成任务的候选应用资格，已发布媒体内容保留。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MetadataJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "maxProperties": 0}}}}}},
    "/metadata-candidates/{id}/apply": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "applyMetadataCandidate", "description": "按所有者、当前资产、30分钟有效期、任务取消状态与当前expectedRevision验证后人工选用并加锁。candidate.target.revision只记录搜索时快照；逐字段选用可使用最新修订。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MediaSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ApplyMetadataRequest"}}}}}},
