    "/matching/default-source": {"post": {"operationId": "setRecordingDefaultSource", "description": "指定本人录音的默认来源；sourceTrackId必须为成员或null，null取消手动指定。手动来源不可用时仍保留。自动选择依次按可用性、码率和原文件大小降序。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DefaultSourceRequest"}}}}, "responses": {"200": {"$ref": "#/components/responses/MatchingMutation"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/matching/exclusions": {"post": {"operationId": "setMatchExclusion", "description": "设置或撤销对称来源对排除；仍在同一录音的排除返回 CONFLICT，需先解除或拆分，不暗改人工关系。", "responses": {"200": {"$ref": "#/components/responses/MatchingMutation"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MatchExclusionRequest"}}}}}},
    "/matching/changes": {"get": {"operationId": "listMatchingChanges", "description": "本人人工操作审计，按 sequence 递增；nextAfter=null 表示当前页末尾，不是后续变更订阅。", "responses": {"200": {"$ref": "#/components/responses/MatchingChanges"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "integer", "minimum": 0, "default": 0}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}]}},
    "/media": {"post": {"operationId": "uploadMedia", "description": "原始正文上传，仅保存预览；歌词language省略或空值统一输出und、大小写统一小写，封面language必须为空。只允许声明的五个query参数，不接受文件名、URL或origin。总HTTP上限8MiB、处理/读取期限30秒；歌词最多1MiB、图片最多8MiB，内容解码校验后决定实际格式与摘要。超限/格式错误分别返回INVALID_ARGUMENT/UNSUPPORTED。", "responses": {"201": {"$ref": "#/components/responses/ContentObject"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}, {"name": "sourceTrackId", "in": "query", "required": true, "schema": {"$ref": "./http.schema.json#/$defs/ID"}}, {"name": "assetId", "in": "query", "required": true, "schema": {"$ref": "./http.schema.json#/$defs/ID"}}, {"name": "assetVersion", "in": "query", "required": true, "schema": {"$ref": "./http.schema.json#/$defs/ID"}}, {"name": "field", "in": "query", "required": true, "schema": {"enum": ["lyrics", "artwork"]}}, {"name": "language", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 64, "pattern": "^(?:[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*)?$"}}], "requestBody": {"required": true, "content": {"text/plain": {"schema": {"type": "string", "format": "binary", "maxLength": 1048576}}, "image/png": {"schema": {"type": "string", "format": "binary", "maxLength": 8388608}}, "image/jpeg": {"schema": {"type": "string", "format": "binary", "maxLength": 8388608}}}}}},
    "/media/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMedia", "description": "按所有者和来源授权交付实际验证正文；包括歌词、封面、PNG缩略图和16MiB以内完整刮削JSON文档，后者强制attachment。缺失/损坏返回RESOURCE_CHANGED并标不可用；总交付期限30秒，不承诺Range。", "responses": {"200": {"description": "经过校验的媒体正文", "headers": {"Content-Length": {"schema": {"type": "integer", "minimum": 1, "maximum": 16777216}}, "Content-Disposition": {"schema": {"type": "string"}}, "X-Content-Type-Options": {"schema": {"const": "nosniff"}}}, "content": {"text/plain": {"schema": {"type": "string", "format": "binary"}}, "image/png": {"schema": {"type": "string", "format": "binary"}}, "image/jpeg": {"schema": {"type": "string", "format": "binary"}}, "application/json": {"schema": {"type": "string", "format": "binary"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/media/{id}/info": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMediaInfo", "description": "读取本人内容或派生对象描述；不内嵌正文，不返回文件路径。", "responses": {"200": {"description": "授权媒体对象描述", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MediaObjectInfo"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/source-tracks/{id}/media-selection": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMediaSelection", "description": "当前来源资产、按字段/语言的绑定、人工锁和修订；对象不可用或旧资产绑定不被伪装成已更新内容。", "responses": {"200": {"$ref": "#/components/responses/MediaSelection"}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "selectMedia", "description": "手动选用本人且适用于当前来源资产的对象，并锁定该字段/语言。上传本身不选用；同键重放、旧修订和资产冲突按显式结果返回；不写回音乐文件。", "responses": {"200": {"$ref": "#/components/responses/MediaSelection"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SelectMediaRequest"}}}}}},
    "/source-tracks/{id}/media-selection/unlock": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "unlockMediaSelection", "description": "独立解除字段/语言人工锁；保留现有内容，不自动触发刮削、覆盖或写回。", "responses": {"200": {"$ref": "#/components/responses/MediaSelection"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UnlockMediaRequest"}}}}}},
    "/playback/sessions": {
      "post": {"operationId": "createPlayback", "description": "preferences.dspExecution=client 跳过部署、个人、全局效果及请求 gainDb；保留解密、编解码和必要声道转换。响应 dspExecution 回显会话固定执行归属，seek/recover 沿用；处理缓存隔离无效果快照。省略按 server，但部署 audioDSP.enabled 默认 false。effectiveProcessing 只返回实际服务端处理。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreatePlayback"}}}}, "responses": {"201": {"$ref": "#/components/responses/Playback"}, "default": {"$ref": "#/components/responses/Error"}}}
    },
