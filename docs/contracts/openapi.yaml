      "CSRF": {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string", "minLength": 16}, "description": "登录后状态修改同时校验允许的 Origin。"},
      "Idempotency": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 8, "maxLength": 128}, "description": "用户/路由/键绑定请求摘要。同键同参数重放已提交结果；不同参数返回 409。播放重试窗口与会话期限一致，摘要创建窗口一小时；过期明确要求使用新操作。"}
    },
    "responses": {
      "Health": {"description": "服务状态", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Health"}}}},
      "Session": {"description": "登录会话", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Session"}}}},
      "Providers": {"description": "授权 Provider 实例，不包含根路径或凭据", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Providers"}}}},
      "ScanAccepted": {"description": "扫描任务已排队、重放或合并相同有效计划的在途扫描", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ScanAccepted"}}}},
      "ScanJob": {"description": "任务状态；未知总数不得当百分比", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ScanJob"}}}},
      "SourceTracks": {"description": "固定修订的持久音乐库分页；asset 描述当前原始资产及有效证据，顶层字段是相同资产的投影。申报摘要与完整文件验证摘要分离；未知码率为 null，hashStatus=unknown 表示尚无持久摘要任务，pending 表示任务已登记。hashConflict 引用当前不一致的申报及验证证据；无公开历史审计端点。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceTracks"}}}},
      "HashAccepted": {"description": "完整文件摘要任务已排队、合并或重放已有任务", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/HashAccepted"}}}},
      "HashJob": {"description": "固定资产的摘要任务状态；成功结果从当前 SourceAsset.fileSha512 读取", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/HashJob"}}}},
      "FingerprintAccepted": {"description": "指纹任务已排队、合并或重放", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FingerprintAccepted"}}}},
      "FingerprintJob": {"description": "固定资产、范围与工具身份的指纹任务", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FingerprintJob"}}}},
      "FingerprintIndexes": {"description": "当前资产的有效指纹索引；不含原始指纹值或路径", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FingerprintIndexes"}}}},
      "FingerprintDetail": {"description": "经授权的有界指纹明细", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FingerprintDetail"}}}},
      "MatchingRevision": {"description": "本用户人工关联修订", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MatchingRevision"}}}},
      "MatchCandidates": {"description": "待人工确认的本地候选", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MatchCandidates"}}}},
      "Recording": {"description": "本人录音和来源成员", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Recording"}}}},
      "RecordingSourceLink": {"description": "来源录音关联及人工决策", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/RecordingSourceLink"}}}},
      "MatchingMutation": {"description": "已提交或幂等重放的人工操作及可逆审计", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MatchingMutation"}}}},
      "MatchingChanges": {"description": "按序列分页的本人关联审计", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MatchingChanges"}}}},
      "ContentObject": {"description": "独立媒体对象、来源与适用目标", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ContentObject"}}}},
      "MediaSelection": {"description": "本人来源的内容绑定与修订", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MediaSelection"}}}},
      "Playback": {"description": "固定输入/输出尝试与能力描述", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Playback"}}}},
      "Error": {"description": "结构化业务错误。400 INVALID_ARGUMENT，401 AUTH_REQUIRED，403 ACCESS_DENIED，404 NOT_FOUND，409 CONFLICT/STALE_ATTEMPT/RESOURCE_CHANGED，410 CURSOR_EXPIRED/SESSION_EXPIRED，415 UNSUPPORTED，429 RATE_LIMITED，503 TEMPORARY_FAILURE/SOURCE_OFFLINE。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Error"}}}},
      "Stream": {"description": "音频正文；只有固定可随机访问表示声明 Content-Length、ETag 与 bytes", "headers": {"Accept-Ranges": {"schema": {"enum": ["bytes", "none"]}}, "Content-Length": {"schema": {"type": "integer", "minimum": 0}}, "ETag": {"schema": {"type": "string"}}}, "content": {"audio/*": {"schema": {"type": "string", "format": "binary"}}}},
      "PartialStream": {"description": "固定表示的 Range 片段", "headers": {"Content-Range": {"required": true, "schema": {"type": "string"}}, "Content-Length": {"schema": {"type": "integer", "minimum": 0}}}, "content": {"audio/*": {"schema": {"type": "string", "format": "binary"}}}}
    }
  }
}
