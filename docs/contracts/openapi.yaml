    "/source-refs/lookup": {"post": {"operationId": "lookupSourceReferences", "responses": {"200": {"description": "读取当前用户可见的展示资料", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceDisplayPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceLookupRequest"}}}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "description": "1..50个SourceRef；只读POST且要求CSRF，保留顺序、重复和逐项错误。先按owner读取本地/远程来源，再按在线实例各发一次批量详情请求；异用户和不存在来源均NOT_FOUND，离线/限流保留逐项错误。资料使用当前值，不声称与旧歌单快照固定。", "x-idempotency": "read-only"}},
