    "/source-artists/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getSourceArtist", "description": "来源内精确署名标签身份localCredit，并非真实人物认证。曲目与专辑分别通过library/search的artistId条件分页。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CatalogArtist"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/library/facets": {"get": {"operationId": "getLibraryFacets", "description": "普通音乐范围包含已开启曲目展示的CD专辑，排除其余CD专辑、ASMR与电台音频；分类及计数只含可见成员。全库分类元数据和未知数量；目录只含不透明ID、父ID与末级名称，无物理路径；playableOnly明确不支持。", "parameters": [{"name": "providerInstanceId", "in": "query", "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}], "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CatalogFacets"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
