    "/recommendations": {"get": {"operationId": "listRecommendations", "description": "按本人来源/匿名账号分组的公共推荐。缓存120秒，失败保留旧items并标stale及逐源error；部分或全部来源失败仍200，不能当作空的成功。refresh不绕限流；不导入个人曲库。", "parameters": [{"name": "instanceId", "in": "query", "style": "form", "explode": true, "schema": {"type": "array", "maxItems": 8, "uniqueItems": true, "items": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, "description": "按请求顺序选择实例，省略为本人配置顺序；配置多于8实例时必须显式选择。"}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}, {"name": "refresh", "in": "query", "schema": {"type": "boolean", "default": false}}], "responses": {"200": {"description": "逐源成功、过期缓存及错误状态", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Recommendations"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances": {"get": {"operationId": "listOnlineInstances", "description": "仅本人配置实例。available要求Worker和平台账号均已校验；supported以已验证平台能力声明为准。plugin包含插件提供的id、默认name与localizedNames，首次未取得有效声明时省略；实例name是管理员别名，不能用作平台标题。不公开执行路径、配置摘要或账号凭据。", "responses": {"200": {"description": "需要平台登录的资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineInstances"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances/{id}/playlists": {"get":{"operationId":"listOnlinePlaylists","description":"读取当前实例已校验账号的歌单，来源和账号由服务端绑定；支持playlist.list时可用。空列表是真实成功结果，不能以推荐或已导入歌单代替。分页游标绑定账号登录代次；此读取不导入、不同步、不写回。","parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":50,"default":20}},{"name":"cursor","in":"query","schema":{"type":"string","maxLength":1024}}],"responses":{"200":{"description":"当前账号的来源歌单页","content":{"application/json":{"schema":{"$ref":"./http.schema.json#/$defs/OnlinePlaylistsPage"}}}},"default":{"$ref":"#/components/responses/Error"}}}},
    "/online-instances/{id}/search": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "searchOnlineMetadata", "description": "按实例独立搜索四类公开资料；保持上游顺序，无跨源排名。q 最多256 UTF-8字节，limit 1..50；游标绑定owner/实例/kind/query/limit，5分钟到期返回CURSOR_EXPIRED，伪造或跨查询游标INVALID_ARGUMENT；Worker重启失效。需要平台登录，否则PLATFORM_AUTH_REQUIRED（403）；网易云EAPI与QQ桌面搜索待实号验收，QQ实体搜索及Apple目录UNSUPPORTED。资料不代表音频播放许可。", "responses": {"200": {"description": "需要平台登录的资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineSearchPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "q", "in": "query", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}, {"name": "cursor", "in": "query", "schema": {"type": "string", "maxLength": 1024}}, {"name": "kind", "in": "query", "schema": {"enum": ["tracks", "albums", "artists", "playlists"], "default": "tracks"}}]}},
    "/online-instances/{id}/tracks/{externalId}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "externalId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9]{1,64}$"}}], "get": {"operationId": "getOnlineTrack", "description": "资料摘要不是音频资产版本，playbackAvailability固定unknown，sourceUrl只指平台资料页面。", "responses": {"200": {"description": "需要平台登录的资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineTrack"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
