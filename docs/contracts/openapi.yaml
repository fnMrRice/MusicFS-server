    "/online-instances/{id}/tracks/{externalId}/resolve": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "externalId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9]{1,64}$"}}], "post": {"operationId": "resolveOnlineTrack", "description": "目前没有经过授权验证的完整音频资源，返回UNSUPPORTED，绝不返回目录preview、播放SDK句柄或替代来源。正文{}，自然操作无幂等键，不产生资源；仍校验CSRF/Origin。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/EmptyRequest"}}}}, "responses": {"415": {"$ref": "#/components/responses/Error"}, "default": {"$ref": "#/components/responses/Error"}}}},
