    "/dsp/settings": {"get": {"operationId": "getDSPSettings", "description": "全局仅管理员可读写。个人未设置或选择继承时使用全局默认，否则个人配置覆盖全局。返回插件声明的输入、输出及参数，不返回可执行路径。", "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateDSPSettings", "description": "校验整条链和修订后保存，仅影响之后创建的播放会话。输出不可继续DSP时禁止后继节点。bufferFrames 为64至16384；外部MFD1 v1仍最多4096。相同幂等键和原修订可重放最后一次相同请求；其他过期修订返回CONFLICT。全局配置只作默认，不与个人链串联。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsRequest"}}}}, "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/dsp/settings/global": {"get": {"operationId": "getGlobalDSPSettings", "description": "全局仅管理员可读写。个人未设置或选择继承时使用全局默认，否则个人配置覆盖全局。返回插件声明的输入、输出及参数，不返回可执行路径。", "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateGlobalDSPSettings", "description": "校验整条链和修订后保存，仅影响之后创建的播放会话。输出不可继续DSP时禁止后继节点。bufferFrames 为64至16384；外部MFD1 v1仍最多4096。相同幂等键和原修订可重放最后一次相同请求；其他过期修订返回CONFLICT。全局配置只作默认，不与个人链串联。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPGlobalSettingsRequest"}}}}, "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/dsp/settings/validate": {"post": {"operationId": "validateDSPSettings", "x-idempotency": "read-only", "description": "只读协商节点输入输出，校验声道、终止标记、缓冲区和已探测编码能力，不启动外部插件、不保存设置。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPValidateRequest"}}}}, "responses": {"200": {"description": "DSP 配置或校验结果", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DSPPreview"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/matching/bulk-merge": {"post": {"operationId": "bulkMergeMatching", "description": "用户主动执行全库批量关联。score 只处理当前有效且达到 minimumScore 的候选；title_artist 直接按本人全部来源中当前可见且可用曲目的非空标题和完整作者集合匹配，不依赖候选或时长。保留已有录音全部成员，包括暂时不可用成员，忽略明确解除的来源；完整连通组含排除或超过256项时整组跳过。所有成功组在同一事务提交并共用一次人工修订；无匹配不推进修订。同幂等键重放包括统计的原结果。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/BulkMergeRequest"}}}}, "responses": {"200": {"description": "批量关联结果及审计；计数包含扩展后的全部录音成员，跳过组不写入。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/BulkMergeResult"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
