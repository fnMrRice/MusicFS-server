    "/library/queries": {"post": {"operationId": "createCatalogQuery", "description": "普通音乐范围包含已开启曲目展示的CD专辑，排除其余CD专辑、ASMR与电台音频；分类及计数只含可见成员。固定全部匹配结果并返回第一页，空条件查询全部本地来源。幂等键绑定规范化query，limit可调整；过期同键410，改条件409。完整队列逐页取到nextCursor=null，任何页不得混合新查询。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateCatalogQuery"}}}}, "responses": {"201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CatalogPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
