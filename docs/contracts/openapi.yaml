    },
    "/source-tracks/{id}/fingerprint-jobs": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "createFingerprint", "description": "手动提交固定资产的 10–120 秒局部指纹；startMs 最多 24 小时。算法与工具身份由服务端注入；默认禁用或工具不可用返回 UNSUPPORTED。无上传或外部识别。", "responses": {"202": {"$ref": "#/components/responses/FingerprintAccepted"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/FingerprintRequest"}}}}}},
