        "responses": {"200": {"description": "有界自动补齐结果页", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MetadataAutomationPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}
      }
