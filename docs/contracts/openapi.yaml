    "/writeback-jobs": {"post": {"operationId": "createWriteBack", "description": "显式把当前选用的歌词/封面写入授权本地FLAC。只接受来源、资产与选择修订，不接收路径或正文；overwrite还需管理员授权。活动播放使任务保持queued。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackRequest"}}}}, "responses": {"202": {"description": "已排队或重放同一任务", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackAccepted"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
