{
  "openapi": "3.1.0",
  "info": {"title": "MusicFS 最小服务 API", "version": "1.0.0", "description": "本地播放、资产证据、完整摘要、局部指纹、人工关联和歌词/封面补全及显式写回契约。接口是否可用以阶段验收记录为准。JSON 语法是 YAML 1.2 子集；模型单一来源为 http.schema.json。"},
  "servers": [{"url": "/api/v1"}],
  "security": [{"sessionCookie": []}],
  "paths": {
    "/recommendations": {"get": {"operationId": "listRecommendations", "description": "按本人来源/匿名账号分组的公共推荐。缓存120秒，失败保留旧items并标stale及逐源error；部分或全部来源失败仍200，不能当作空的成功。refresh不绕限流；不导入个人曲库。", "parameters": [{"name": "instanceId", "in": "query", "style": "form", "explode": true, "schema": {"type": "array", "maxItems": 8, "uniqueItems": true, "items": {"type": "string", "minLength": 1, "maxLength": 128}}, "description": "按请求顺序选择实例，省略为本人配置顺序；配置多于8实例时必须显式选择。"}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}, {"name": "refresh", "in": "query", "schema": {"type": "boolean", "default": false}}], "responses": {"200": {"description": "逐源成功、过期缓存及错误状态", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Recommendations"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances": {"get": {"operationId": "listOnlineInstances", "description": "仅本人配置实例。available只说明Worker已启动；supported以已验证平台能力声明为准。账号固定空匿名，不公开执行路径或配置摘要。", "responses": {"200": {"description": "匿名资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineInstances"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances/{id}/search": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "searchOnlineTracks", "description": "只读搜索；q最多256 UTF-8字节；游标绑定owner/instance/query/limit且5分钟过期或Worker重启失效，不承诺远程快照。QQ尚未通过近期现网成功验收，Apple返回AUTH_REQUIRED。", "responses": {"200": {"description": "匿名资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineSearchPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "q", "in": "query", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}, {"name": "cursor", "in": "query", "schema": {"type": "string", "maxLength": 1024}}]}},
    "/online-instances/{id}/tracks/{externalId}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "externalId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9]{1,64}$"}}], "get": {"operationId": "getOnlineTrack", "description": "资料摘要不是音频资产版本，playbackAvailability固定unknown，sourceUrl只指平台资料页面。", "responses": {"200": {"description": "匿名资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineTrack"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances/{id}/playlists/{externalId}": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "externalId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9]{1,64}$"}}], "get": {"operationId": "observeOnlinePlaylist", "description": "只读取一次公开unversioned观测，保留重复出现的位置。最多10000条，complete不证明上游稳定快照；不导入个人曲库、不据此删除已有条目。", "responses": {"200": {"description": "匿名资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineObservation"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/online-instances/{id}/recommendations": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getOnlineRecommendations", "description": "匿名公共推荐第一页；personalized=false，无下一页。观测有效期120秒，本接口每次查询仍受Worker准入限流，后续聚合缓存另行提供。", "responses": {"200": {"description": "匿名资料观测，不代表导入或音频播放许可", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/OnlineRecommendationPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}]}},
    "/online-instances/{id}/tracks/{externalId}/resolve": {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "externalId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9]{1,64}$"}}], "post": {"operationId": "resolveOnlineTrack", "description": "目前没有经过授权验证的完整音频资源，返回UNSUPPORTED，绝不返回目录preview、播放SDK句柄或替代来源。正文{}，自然操作无幂等键，不产生资源；仍校验CSRF/Origin。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/EmptyRequest"}}}}, "responses": {"415": {"$ref": "#/components/responses/Error"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/media/{id}/thumbnail": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "createThumbnail", "description": "对已授权可用artwork生成不放大的PNG缩略图，最长边256。正文{}，自然幂等，无额外key；保留所有者、父对象与变换身份。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/EmptyRequest"}}}}, "responses": {"200": {"description": "已发布或重放的缩略图描述", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/DerivedObject"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/metadata-jobs/{id}/documents": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listScrapeDocuments", "description": "读取当前所有者任务的完整结构化尝试文档索引，最多1024项。正文通过media对象授权读取，不在任务或数据库摘要中内嵌；一项绑定一个来源/资产/代次。", "responses": {"200": {"description": "尝试文档列表", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ScrapeDocuments"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/source-albums": {"get": {"operationId": "listSourceAlbums", "description": "仅所有者范围，按稳定ID分页，不按同名自动合并。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceAlbums"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}, {"name": "providerInstanceId", "in": "query", "schema": {"type": "string", "minLength": 1, "maxLength": 128}}]}, "post": {"operationId": "createSourceAlbum", "description": "显式创建独立身份；名称只用于显示，成员必须属于当前用户。", "responses": {"201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceAlbum"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateSourceAlbumRequest"}}}}}},
    "/source-albums/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getSourceAlbum", "description": "读取明确身份及当前成员修订。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceAlbum"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateSourceAlbum", "description": "以预期修订完整替换名称和成员；成员变化不清除独立封面。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SourceAlbum"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UpdateSourceAlbumRequest"}}}}}},
    "/source-albums/{id}/cover-selection": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getSourceAlbumCover", "description": "封面有独立修订和人工锁，保留选用时的来源资产依据。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumCoverSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "selectSourceAlbumCover", "description": "只选择成员当前资产的可用artwork对象；校验封面及目标成员修订，持有真实媒体文件保护。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumCoverSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SelectAlbumCoverRequest"}}}}}},
    "/source-albums/{id}/cover-selection/unlock": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "unlockSourceAlbumCover", "description": "只解除独立封面人工锁，不清除选用对象。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumCoverSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UnlockAlbumCoverRequest"}}}}}},
    "/source-albums/{id}/changes": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listSourceAlbumChanges", "description": "按sequence审计成员与独立封面变化；after为非负十进制序列。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumChanges"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]}},
    "/releases": {"get": {"operationId": "listReleases", "description": "仅所有者范围，按稳定ID分页，不按同名自动合并。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Releases"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]}, "post": {"operationId": "createRelease", "description": "显式创建独立身份；名称只用于显示，成员必须属于当前用户。", "responses": {"201": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Release"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateReleaseRequest"}}}}}},
    "/releases/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getRelease", "description": "读取明确身份及当前成员修订。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Release"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updateRelease", "description": "以预期修订完整替换名称和成员；成员变化不清除独立封面。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/Release"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UpdateReleaseRequest"}}}}}},
    "/releases/{id}/cover-selection": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getReleaseCover", "description": "封面有独立修订和人工锁，保留选用时的来源资产依据。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumCoverSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "selectReleaseCover", "description": "只选择成员当前资产的可用artwork对象；校验封面及目标成员修订，持有真实媒体文件保护。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumCoverSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/SelectAlbumCoverRequest"}}}}}},
    "/releases/{id}/cover-selection/unlock": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "unlockReleaseCover", "description": "只解除独立封面人工锁，不清除选用对象。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumCoverSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/UnlockAlbumCoverRequest"}}}}}},
    "/releases/{id}/changes": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "listReleaseChanges", "description": "按sequence审计成员与独立封面变化；after为非负十进制序列。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/AlbumChanges"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "after", "in": "query", "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]}},
    "/writeback-jobs": {"post": {"operationId": "createWriteBack", "description": "显式把当前选用的歌词/封面写入授权本地FLAC。只接受来源、资产与选择修订，不接收路径或正文；overwrite还需管理员授权。活动播放使任务保持queued。", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackRequest"}}}}, "responses": {"202": {"description": "已排队或重放同一任务", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackAccepted"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/writeback-jobs/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getWriteBack", "description": "所有者范围的任务与安全结果；停用写回后仍可读取。", "responses": {"200": {"description": "写回任务", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/writeback-jobs/{id}/cancel": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "cancelWriteBack", "description": "仅取消queued任务；已cancelled自然幂等。running/recovery拒绝取消，不进行隐藏回滚。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/EmptyRequest"}}}}, "responses": {"200": {"description": "原任务状态", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/writeback-jobs/{id}/recover": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "recoverWriteBack", "description": "复核授权后安排原任务在后台恢复，200仅返回当前状态，应继续GET轮询。仅recovery可安排；完整succeeded返回原任务。自然幂等，无新ID，不覆盖未知外部改动。", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/EmptyRequest"}}}}, "responses": {"200": {"description": "原任务当前状态", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/WriteBackJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/scan-jobs/{id}/metadata-results": {
      "parameters": [{"$ref": "#/components/parameters/ID"}],
      "get": {
        "operationId": "getScanMetadataResults",
        "description": "逐来源查看成功扫描所触发的歌词导入或自动补齐，保留各项状态及人工锁/歧义等跳过原因。扫描结束不代表歌词补齐已结束。只返回当前用户的扫描结果。",
        "parameters": [{"name": "cursor", "in": "query", "schema": {"type": "string", "maxLength": 256}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}],
        "responses": {"200": {"description": "有界自动补齐结果页", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MetadataAutomationPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}
      }
    },
    "/scraper-instances": {"get": {"operationId": "listScraperInstances", "description": "仅返回当前所有者的安全实例声明；available表示已启用且程序校验通过，不保证每个源都可提取。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ScraperInstances"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/metadata-jobs": {"post": {"operationId": "createMetadataJob", "description": "sourceTrackIds显式来源批量或sourceAlbum编号/预期修订二选一；专辑在入队事务固定成员、当前资产与选择修订，超过64明确拒绝。最多4个实例。查询修正不被本地插件支持，非空修正返回UNSUPPORTED；语言只按声明值过滤，不推断正文。搜索有界预取预览，不改变当前选择。", "responses": {"202": {"$ref": "#/components/responses/HashAccepted"}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/CreateMetadataRequest"}}}}}},
    "/metadata-jobs/{id}": {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getMetadataJob", "description": "逐目标状态、问题和安全候选；没有正文、私有路径或资源票据。预览由previewObjectId通过media接口授权读取。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MetadataJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/metadata-jobs/{id}/cancel": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "cancelMetadataJob", "description": "自然幂等取消，不需要幂等键；取消包括已完成任务的候选应用资格，已发布媒体内容保留。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MetadataJob"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "maxProperties": 0}}}}}},
    "/metadata-candidates/{id}/apply": {"parameters": [{"$ref": "#/components/parameters/ID"}], "post": {"operationId": "applyMetadataCandidate", "description": "按所有者、当前资产、30分钟有效期、任务取消状态与当前expectedRevision验证后人工选用并加锁。candidate.target.revision只记录搜索时快照；逐字段选用可使用最新修订。", "responses": {"200": {"description": "成功", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/MediaSelection"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ApplyMetadataRequest"}}}}}},
    "/health/live": {"get": {"operationId": "healthLive", "security": [], "responses": {"200": {"$ref": "#/components/responses/Health"}}}},
    "/health/ready": {"get": {"operationId": "healthReady", "security": [], "responses": {"200": {"$ref": "#/components/responses/Health"}, "503": {"$ref": "#/components/responses/Health"}}}},
    "/auth/session": {
      "post": {"operationId": "login", "security": [{"bootstrapBearer": []}], "description": "必须有允许的 Origin；首次凭据交换不要求 CSRF。成功设置 HttpOnly、SameSite=Strict Cookie；HTTPS 加 Secure。", "responses": {"200": {"$ref": "#/components/responses/Session"}, "default": {"$ref": "#/components/responses/Error"}}},
