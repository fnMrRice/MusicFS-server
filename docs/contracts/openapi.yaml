    "/admin/plugin-instances/{id}/directories": {"get": {"operationId": "listManagedPluginDirectories", "description": "仅管理员浏览Local Files部署授权；pending实例也可用。省略path列出允许根，指定path只列该根范围内的直接子目录，不返回文件。此接口允许向管理员返回绝对路径，configuration和普通Provider投影仍脱敏。每页最多检查100个条目，items可能为空而nextCursor非空；只在nextCursor为null时结束。cursor绑定实例、路径、配置修订和目录修改时间；失效返回CURSOR_EXPIRED并重新浏览。", "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "path", "in": "query", "required": false, "schema": {"type": "string", "minLength": 1, "maxLength": 4096}}, {"name": "cursor", "in": "query", "required": false, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}], "responses": {"200": {"description": "部署允许目录或直接子目录；available仅表示当前可读取，不替代保存时的权限和存储隔离校验。", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ManagedPluginDirectories"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/control": {"get": {"operationId": "openControlChannel", "security": [{"sessionCookie": []}], "description": "WebSocket 控制通道；必须协商 musicfs.control.v1 并通过配置的 Origin 检查。升级后5秒内发送 auth 消息验证 CSRF，ready 后才能发送命令。每10秒应用 ping/pong，30秒无入站消息关闭；每会话最多8连接。播放控制、租约续期、能力和本地生命周期通知共用通道。activity.changed 按资源提示后台任务变化，客户端在收到通知和重连就绪后查询关注的数据。音频继续使用 HTTP。消息契约见 control.schema.json，重连不重放命令；心跳不自动续租。", "parameters": [{"name": "Origin", "in": "header", "required": true, "schema": {"type": "string"}}, {"name": "Sec-WebSocket-Protocol", "in": "header", "required": true, "schema": {"const": "musicfs.control.v1"}}], "x-client-message": {"$ref": "./control.schema.json#/$defs/ClientMessage"}, "x-server-message": {"$ref": "./control.schema.json#/$defs/ServerMessage"}, "responses": {"101": {"description": "升级完成；auth 验证成功并收到 ready 后才可执行控制请求。"}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/admin/plugin-operations/{id}": {"get": {"operationId": "getPluginOperation", "description": "管理员查询操作。停用 succeeded 只表示保存完成，restartRequired 记录该次保存后全局待重启开关的历史标志，不随撤销或重启改写；当前状态以管理快照为准；draining 仅用于配置重建。", "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginOperation"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
    "/admin/plugin-instances/{id}/configuration": {"get": {"operationId": "getPluginConfiguration", "description": "管理员插件管理；只返回安全配置投影。本地音乐返回 rootImportDefaultsSupported:true 及 roots[].importDefaults 完整有效目录设置。", "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/ManagedPluginConfiguration"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "setPluginConfiguration", "description": "按GET返回schema校验；路径只写。importDefaults/watch/musicRoots整组替换，省略顶层字段保留。Local Files设置保存到Server数据库，YAML仅提供目录权限上限；其他插件沿用YAML。保存后drain并重建实例，musicRoots允许空数组；重建沿用当前运行开关，不提前应用待重启停用，也不越过待重启变更推进appliedRevision。musicRoots[].importDefaults 仅修改目标目录导入设置；已有根省略时保留，新根省略时继承实例默认。顶级 importDefaults 保持实例默认语义。importDefaults支持recursive/maxDepth及skipHidden/respectNoMedia；后两项默认true，分别跳过点开头或Windows隐藏项、遵循.nomedia跳过标记所在目录及子树；配置读取明确返回false值。recursive=true时maxDepth=0表示不限深度，正数1—64限制子目录层数；recursive=false时只能为0并仅查找当前目录。", "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "If-Match", "in": "header", "required": true, "schema": {"type": "string", "description": "GET返回的ETag，或64位配置修订"}}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"202": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginOperation"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginConfigurationUpdate"}}}}}},
    "/admin/plugin-instances/{instanceId}/state": {"put": {"operationId": "setPluginInstanceState", "description": "管理员保存普通插件实例开关；必需 SQLite 存储没有可停用实例。停用需重启 Server；当前 Worker、任务、播放、新工作准入和 generation 保持。mode=drain/force 已废弃并仅作兼容，均不排空或取消。启用仍可动态应用。", "security": [{"sessionCookie": []}], "parameters": [{"name": "instanceId", "in": "path", "required": true, "schema": {"$ref": "./http.schema.json#/$defs/InstanceID"}}, {"name": "If-Match", "in": "header", "required": true, "schema": {"type": "string", "description": "GET返回的ETag，或64位配置修订"}}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"202": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginOperation"}}}}, "default": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginStateUpdate"}}}}}},
