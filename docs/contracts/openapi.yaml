    "/plugin-settings/{pluginId}": {"parameters": [{"name": "pluginId", "in": "path", "required": true, "schema": {"type": "string"}}], "get": {"operationId": "getPluginSettings", "responses": {"200": {"description": "PluginSettingsPage", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "updatePluginSettings", "x-idempotency": "natural", "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsRequest"}}}}, "description": "按schema与设置修订校验后替换当前用户偏好。写入仅在expectedRevision匹配时生效；原修订重试返回CONFLICT而不重复写入，响应不确定时先GET确认。只接受插件声明的字段，不执行脚本、URL或任意宿主命令。支持在线播放的来源共享 cacheLimitMiB 和 streamWhileDownloading，网易云另提供 playbackQuality。FFmpeg 的 decodeOutput 可选择 native、pcm_f32le、pcm_s16le，保存后对新播放会话生效，活动会话与指纹规格保持原有设置。", "responses": {"200": {"description": "PluginSettingsPage", "content": {"application/json": {"schema": {"$ref": "./http.schema.json#/$defs/PluginSettingsPage"}}}}, "default": {"$ref": "#/components/responses/Error"}}}},
