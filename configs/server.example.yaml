# yaml-language-server: $schema=./server.schema.json
configVersion: 1
listen: '127.0.0.1:8080'
allowLoopbackHttp: true
allowedOrigins:
  - 'http://127.0.0.1:8080'
  - 'http://127.0.0.1:5173'
dataRoot: '../data'
mediaRoot: '../media'
cacheRoot: '../cache'
storage:
  backend: 'sqlite'
audioDSP:
  chain: []
  plugins: []
webRoot: ''
pluginBundle: '../build/windows/musicfs-plugins.exe'
plugins:
  - pluginId: 'musicfs.plugin.source.localfiles'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'local']
    instances:
      - instanceId: 'b1548e96-3081-5c9c-8376-bf290e369d51'
        config: {}
  - pluginId: 'musicfs.plugin.decoder.ffmpeg'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'audio-ffmpeg']
    instances:
      - instanceId: '16b003e5-1bab-52bb-be10-0e83ec1c40ea'
        config:
          ffmpegPath: ''
          ffprobePath: ''
  - pluginId: 'musicfs.plugin.decoder.ncm'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'ncm']
    instances:
      - instanceId: '96412f52-9ff4-5a82-9eaa-7644a5837cda'
        config: {}
  - pluginId: 'musicfs.scraper.local'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'scraper-local']
    instances:
      - instanceId: 'd248bf34-1780-59d3-a557-9cf5d889e977'
        config: {}
  - pluginId: 'musicfs.plugin.source.netease'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'netease']
    instances:
      - instanceId: 'a5e47aac-f949-5e45-9709-f28a0d8443df'
        config: {}
  - pluginId: 'musicfs.plugin.source.qqmusic'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'qqmusic']
    instances:
      - instanceId: 'fc2264bd-13bc-5dc6-be83-6c4428cf4d40'
        config: {}
  - pluginId: 'musicfs.plugin.source.applemusic'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'applemusic']
    instances:
      - instanceId: '701b805f-494f-5509-897f-17c934b1a8ed'
        config: {}
maxSessions: 8
maxProcessing: 2
maxCacheBytes: 1073741824
sessionTtlSeconds: 3600
metadata:
  automatic:
    instancePriority: ['d248bf34-1780-59d3-a557-9cf5d889e977']
    fields: ['lyrics', 'artwork']
    languages: []
hashing:
  auto: false
  maxConcurrent: 1
  bytesPerSecond: 4194304
writeBack:
  enabled: false
  allowOverwrite: false
  maxFileBytes: 8589934592
  roots: []
fingerprinting:
  enabled: false
  fpcalcPath: ''
  fpcalcSha256: ''
  maxConcurrent: 1
  timeoutSeconds: 30
