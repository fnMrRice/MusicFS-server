# yaml-language-server: $schema=./server.schema.json
configVersion: 1
listen: '127.0.0.1:8080'
allowLoopbackHttp: true
allowedOrigins:
  - 'http://127.0.0.1:8080'
  - 'http://127.0.0.1:5173'
dataRoot: '../data'
mediaRoot: '../media'
cacheRoot: '../cache'
webRoot: ''
pluginBundle: '../build/windows/musicfs-plugins.exe'
plugins:
  - pluginId: 'musicfs.localfiles'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'local']
    instances:
      - instanceId: 'local'
        name: '本地音乐'
        role: 'provider'
        # Default access: the server user's Music folder and Windows download folders.
        # Override access with permissions.readDirectories; this does not select music roots.
        # Select import directories in Web settings after startup.
        config: {}
  - pluginId: 'musicfs.audio.ffmpeg'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'audio-ffmpeg']
    # Starts automatically when both tool paths are configured; enabled: false opts out.
    instances:
      - instanceId: 'audio-default'
        role: 'audio'
        config:
          ffmpegPath: ''
          ffprobePath: ''
  - pluginId: 'musicfs.ncm'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'ncm']
    instances:
      - instanceId: 'ncm-default'
        role: 'audio'
        config: {}
  - pluginId: 'musicfs.scraper.local'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'scraper-local']
    # Automatic import still requires importLyrics or metadata.automatic below.
    instances:
      - instanceId: 'scraper-local'
        name: '本地歌词与封面'
        role: 'scraper'
        config: {}
  - pluginId: 'musicfs.netease'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'netease']
    # Public metadata only; no login, audio resolution or automatic library import.
    instances:
      - instanceId: 'netease-public'
        name: '网易云公开资料'
        role: 'provider'
        config: {}
  - pluginId: 'musicfs.qqmusic'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'qqmusic']
    # Latest live search failed upstream; no supported capability is advertised.
    instances:
      - instanceId: 'qq-public'
        role: 'provider'
        config: {}
  - pluginId: 'musicfs.applemusic'
    executable: '../build/windows/musicfs-plugins.exe'
    args: ['--plugin', 'applemusic']
    # Credential support is not implemented; catalog calls return AUTH_REQUIRED.
    instances:
      - instanceId: 'apple-public'
        role: 'provider'
        config: {}
maxSessions: 8
maxProcessing: 2
maxCacheBytes: 1073741824
sessionTtlSeconds: 3600
metadata:
  automatic:
    instancePriority: ['scraper-local']
    fields: ['lyrics', 'artwork']
    languages: []
hashing:
  auto: false
  maxConcurrent: 1
  bytesPerSecond: 4194304
writeBack:
  enabled: false
  allowOverwrite: false
  maxFileBytes: 8589934592
  # Explicit instance/root/field grants are required before enabling.
  roots: []
fingerprinting:
  enabled: false
  # Configure a verified Chromaprint 1.6.1 fpcalc and enable the audio plugin first.
  fpcalcPath: ''
  fpcalcSha256: ''
  maxConcurrent: 1
  timeoutSeconds: 30
