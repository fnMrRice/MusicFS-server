# yaml-language-server: $schema=./server.schema.json
configVersion: 1
listen: '127.0.0.1:8080'
allowLoopbackHttp: true
allowedOrigins:
  - 'http://127.0.0.1:8080'
  - 'http://127.0.0.1:5173'
dataRoot: '../data'
mediaRoot: '../media'
cacheRoot: '../cache'
webRoot: ''
plugins:
  - pluginId: 'musicfs.localfiles'
    executable: '../build/windows/musicfs-plugin-local.exe'
    enabled: true
    instances:
      - instanceId: 'local'
        name: '本地音乐'
        role: 'provider'
        enabled: true
        importDefaults:
          recursive: true
          maxDepth: 64
          importLyrics: false
        config:
          musicRoots:
            # Replace with your music directory; this sample uses project fixtures.
            - id: 'local'
              name: '合成测试音乐'
              path: '../tests/testdata/audio'
  - pluginId: 'musicfs.audio.ffmpeg'
    executable: '../build/windows/musicfs-plugin-audio-ffmpeg.exe'
    # Set both enabled values to true after configuring the two tool paths.
    enabled: false
    instances:
      - instanceId: 'audio-default'
        role: 'audio'
        enabled: false
        config:
          ffmpegPath: ''
          ffprobePath: ''
  - pluginId: 'musicfs.ncm'
    executable: '../build/windows/musicfs-plugin-ncm.exe'
    enabled: true
    instances:
      - instanceId: 'ncm-default'
        role: 'audio'
        enabled: true
        config: {}
  - pluginId: 'musicfs.scraper.local'
    executable: '../build/windows/musicfs-plugin-scraper-local.exe'
    # Automatic import still requires importLyrics or metadata.automatic below.
    enabled: true
    instances:
      - instanceId: 'scraper-local'
        name: '本地歌词与封面'
        role: 'scraper'
        enabled: true
        config: {}
maxSessions: 8
maxProcessing: 2
maxCacheBytes: 1073741824
sessionTtlSeconds: 3600
metadata:
  automatic:
    enabled: false
    instancePriority: ['scraper-local']
    fields: ['lyrics', 'artwork']
    languages: []
hashing:
  auto: false
  maxConcurrent: 1
  bytesPerSecond: 4194304
fingerprinting:
  enabled: false
  # Configure a verified Chromaprint 1.6.1 fpcalc and enable the audio plugin first.
  fpcalcPath: ''
  fpcalcSha256: ''
  maxConcurrent: 1
  timeoutSeconds: 30
