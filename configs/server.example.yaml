# yaml-language-server: $schema=./server.schema.json
configVersion: 1
listen: '127.0.0.1:8080'
allowLoopbackHttp: true
allowedOrigins:
  - 'http://127.0.0.1:8080'
  - 'http://127.0.0.1:5173'
dataRoot: '../data'
mediaRoot: '../media'
cacheRoot: '../cache'
webRoot: ''
plugins:
  - pluginId: 'musicfs.localfiles'
    executable: '../build/windows/musicfs-plugin-local.exe'
    enabled: true
    instances:
      - instanceId: 'local'
        name: '本地音乐'
        role: 'provider'
        enabled: true
        importDefaults:
          recursive: true
          maxDepth: 64
          importLyrics: false
          excludePatterns: []
        config:
          watch:
            enabled: false
            debounceMs: 1000
            maxDelayMs: 10000
            fullRescanSeconds: 3600
          musicRoots:
            # Replace with your music directory; this sample uses project fixtures.
            - id: 'local'
              name: '合成测试音乐'
              path: '../tests/testdata/audio'
  - pluginId: 'musicfs.audio.ffmpeg'
    executable: '../build/windows/musicfs-plugin-audio-ffmpeg.exe'
    # Set both enabled values to true after configuring the two tool paths.
    enabled: false
    instances:
      - instanceId: 'audio-default'
        role: 'audio'
        enabled: false
        config:
          ffmpegPath: ''
          ffprobePath: ''
  - pluginId: 'musicfs.ncm'
    executable: '../build/windows/musicfs-plugin-ncm.exe'
    enabled: true
    instances:
      - instanceId: 'ncm-default'
        role: 'audio'
        enabled: true
        config: {}
  - pluginId: 'musicfs.scraper.local'
    executable: '../build/windows/musicfs-plugin-scraper-local.exe'
    # Automatic import still requires importLyrics or metadata.automatic below.
    enabled: true
    instances:
      - instanceId: 'scraper-local'
        name: '本地歌词与封面'
        role: 'scraper'
        enabled: true
        config: {}
  - pluginId: 'musicfs.netease'
    executable: '../build/windows/musicfs-plugin-netease.exe'
    # Public metadata only; no login, audio resolution or automatic library import.
    enabled: false
    instances:
      - instanceId: 'netease-public'
        name: '网易云公开资料'
        role: 'provider'
        enabled: false
        config: {}
  - pluginId: 'musicfs.qqmusic'
    executable: '../build/windows/musicfs-plugin-qqmusic.exe'
    # Latest live search failed upstream; no supported capability is advertised.
    enabled: false
    instances:
      - instanceId: 'qq-public'
        role: 'provider'
        enabled: false
        config: {}
  - pluginId: 'musicfs.applemusic'
    executable: '../build/windows/musicfs-plugin-applemusic.exe'
    # Credential support is not implemented; catalog calls return AUTH_REQUIRED.
    enabled: false
    instances:
      - instanceId: 'apple-public'
        role: 'provider'
        enabled: false
        config: {}
maxSessions: 8
maxProcessing: 2
maxCacheBytes: 1073741824
sessionTtlSeconds: 3600
metadata:
  automatic:
    enabled: false
    instancePriority: ['scraper-local']
    fields: ['lyrics', 'artwork']
    languages: []
hashing:
  auto: false
  maxConcurrent: 1
  bytesPerSecond: 4194304
writeBack:
  enabled: false
  allowOverwrite: false
  maxFileBytes: 8589934592
  # Explicit instance/root/field grants are required before enabling.
  roots: []
fingerprinting:
  enabled: false
  # Configure a verified Chromaprint 1.6.1 fpcalc and enable the audio plugin first.
  fpcalcPath: ''
  fpcalcSha256: ''
  maxConcurrent: 1
  timeoutSeconds: 30
